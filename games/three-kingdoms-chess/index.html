<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>三國戰棋 · 歷史全紀元 (增益防護·貫日穿透版 v1.3.0)</title>
  <style>
    :root {
      --bg: #0f0f17;
      --card-bg: #1a1a27;
      --panel: #232334;
      --border: #3b3b55;
      --text: #e6e6f0;
      --dim: #8e8ea6;
      --gold: #f5c542;
      --c-green: #2ecc71;
      --c-blue: #3498db;
      --c-purple: #9b59b6;
      --c-red: #e74c3c;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
    }
    #game-stage {
      width: 1100px; height: 720px;
      flex-shrink: 0;
      transform-origin: center center;
      display: flex; flex-direction: column;
      box-sizing: border-box;
      padding: 10px 16px;
      position: relative;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      height: 44px; border-bottom: 1px solid var(--border);
      margin-bottom: 8px; padding-bottom: 4px;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    h1 { margin: 0; font-size: 19px; color: var(--gold); letter-spacing: 1.2px; }
    .version-tag {
      font-size: 11px; font-weight: bold; color: var(--gold);
      background: #252210; border: 1px solid var(--gold);
      padding: 2px 7px; border-radius: 10px; letter-spacing: 0.5px;
    }
    .nav-bar { display: flex; gap: 8px; align-items: center; }
    .badge {
      background: #252210; color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 12px; border-radius: 16px; font-weight: bold; font-size: 13px;
    }
    button {
      padding: 6px 12px; border-radius: 6px; font-weight: bold;
      cursor: pointer; font-size: 12.5px; transition: all 0.15s;
      border: 1px solid var(--border); background: var(--panel); color: #fff;
    }
    button:hover:not(:disabled) { filter: brightness(1.2); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-active { background: #34495e; border-color: var(--c-blue); }
    .btn-main { background: #2980b9; border: none; }
    .btn-act { background: #27ae60; border: none; }
    .btn-skill { background: #8e44ad; border: none; width: 100%; text-align: left; padding: 7px 10px; margin: 4px 0; }

    .tier-green { color: var(--c-green) !important; }
    .tier-blue { color: var(--c-blue) !important; }
    .tier-purple { color: var(--c-purple) !important; }
    .tier-red { color: var(--c-red) !important; }
    .bg-green { border-color: var(--c-green); }
    .bg-blue { border-color: var(--c-blue); }
    .bg-purple { border-color: var(--c-purple); }
    .bg-red { border-color: var(--c-red); box-shadow: 0 0 10px rgba(231,76,60,0.3); }

    .view-container { flex: 1; display: none; height: calc(100% - 54px); }

    #battle-view { display: flex; gap: 14px; }
    .battle-left {
      width: 540px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; display: flex; flex-direction: column; align-items: center;
    }
    .grid-box {
      display: grid; grid-template-columns: repeat(6, 80px); grid-template-rows: repeat(6, 80px);
      gap: 5px; background: #0b0b10; padding: 6px; border-radius: 8px;
    }
    .cell {
      width: 80px; height: 80px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 11px;
      cursor: pointer; border-radius: 6px; position: relative;
    }
    .plains { background: #2f4523; color: #fff; }
    .forest { background: #183318; color: #a3e098; }
    .mountain { background: #3d342a; color: #d7ccc8; }
    .fort { background: #4a2c20; color: #ffcc80; border: 1px dashed var(--gold); }
    
    .cell-unit {
      border: 2px solid; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .unit-p { background: #1b4d24 !important; border-color: var(--c-green); box-shadow: 0 0 6px rgba(46,204,113,0.5); }
    .unit-e { background: #631717 !important; border-color: var(--c-red); box-shadow: 0 0 6px rgba(231,76,60,0.5); }
    .unit-e-boss { border-color: var(--gold) !important; box-shadow: 0 0 10px var(--gold) !important; }
    .cell-selected { outline: 3px solid var(--gold); z-index: 2; }
    .cell-moved { border-style: dashed !important; box-shadow: 0 0 10px var(--gold) !important; }
    .cell-acted { opacity: 0.55; filter: grayscale(70%); }
    .unit-shielded { box-shadow: inset 0 0 8px #3498db, 0 0 8px #3498db !important; }

    .battle-right { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .panel-box {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; box-sizing: border-box;
    }
    .panel-title {
      font-size: 13px; font-weight: bold; color: var(--gold);
      border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px;
    }
    .portrait-stage { display: flex; gap: 12px; align-items: center; }
    .svg-avatar {
      width: 95px; height: 110px; background: #0c0c14;
      border: 2px solid var(--border); border-radius: 6px; flex-shrink: 0;
      overflow: hidden;
    }
    .svg-avatar svg { width: 100%; height: 100%; }

    .scroll-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; overflow-y: auto; flex: 1; padding: 4px;
    }
    .card {
      background: #171724; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; display: flex; flex-direction: column;
      align-items: center; text-align: center; position: relative;
    }
    .card-thumb { width: 70px; height: 82px; margin-bottom: 6px; border-radius: 4px; overflow: hidden; background: #0c0c12; }
    .card-thumb svg { width: 100%; height: 100%; }

    .modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none;
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-box {
      background: var(--card-bg); border: 2px solid var(--gold);
      border-radius: 10px; padding: 24px; width: 480px; text-align: center;
    }
  </style>
</head>
<body>

<div id="game-stage">
  <header>
    <div class="header-left">
      <h1>三國戰棋 · 歷史全紀元</h1>
      <span class="version-tag">v1.3.0 貫日增益版</span>
    </div>
    <div class="nav-bar">
      <div class="badge" id="gold-hud">💰 500</div>
      <button class="btn-active" id="btn-tab-battle" onclick="switchTab('battle')">⚔ 戰役沙盤</button>
      <button id="btn-tab-deploy" onclick="switchTab('deploy')">🚩 軍團備戰 (<span id="deploy-hud">3</span>/6)</button>
      <button id="btn-tab-tavern" onclick="switchTab('tavern')">🍶 英雄酒館</button>
      <button id="btn-tab-forge" onclick="switchTab('forge')">🔨 洛陽鐵匠鋪</button>
    </div>
  </header>

  <div class="view-container" id="battle-view" style="display: flex;">
    <div class="battle-left">
      <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:6px;">
        <span style="font-weight:bold; color:var(--gold);" id="ch-title">載入中...</span>
        <span style="color:#ffd54f; font-weight:bold;" id="turn-txt">回合 1 (玩家行動)</span>
      </div>
      <div class="grid-box" id="grid"></div>
      <div style="font-size:11px; color:var(--dim); margin-top:6px;">
        特性：弓兵盲區(1格不可射，射程2~3格) | 太史慈【貫日連珠】沿直線穿透兩名敵軍。
      </div>
    </div>

    <div class="battle-right">
      <div class="panel-box">
        <div class="panel-title">📜 戰役演義傳記</div>
        <div id="story-txt" style="font-size:12px; line-height:1.45; min-height:42px; color:#f0f0f5;"></div>
      </div>

      <div class="panel-box">
        <div class="panel-title">🛡 武將持武立繪與屬性</div>
        <div class="portrait-stage">
          <div class="svg-avatar" id="cur-avatar"></div>
          <div id="cur-info" style="font-size:12px; line-height:1.35; flex:1;"></div>
        </div>
        <div id="cur-skills" style="margin-top:6px;"></div>
      </div>

      <div class="panel-box" style="flex:1; display:flex; flex-direction:column;">
        <div class="panel-title">⚔ 即時軍情日誌</div>
        <div id="battle-log" style="flex:1; overflow-y:auto; font-family:monospace; font-size:11px; color:#a5d6a7;"></div>
      </div>
    </div>
  </div>

  <div class="view-container" id="deploy-view">
    <div class="panel-box" style="width:100%; height:100%; display:flex; flex-direction:column;">
      <div class="panel-title" style="display:flex; justify-content:space-between;">
        <span>🚩 戰前陣容點將錄 (當前出征: <span id="deploy-count" style="color:var(--gold);">0</span> / 6)</span>
        <span style="font-size:12px; color:var(--dim);">主角必定上陣</span>
      </div>
      <div class="scroll-grid" id="deploy-list"></div>
    </div>
  </div>

  <div class="view-container" id="tavern-view">
    <div class="panel-box" style="width:100%; height:100%; display:flex; flex-direction:column;">
      <div class="panel-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>🍶 英雄酒館 (百將名冊 | 紅將 1% 極稀有 | 滿 5 碎片升星)</span>
        <button onclick="refreshTavern(true)">🎲 40 銅錢 刷新名冊</button>
      </div>
      <div class="scroll-grid" id="tavern-list"></div>
    </div>
  </div>

  <div class="view-container" id="forge-view">
    <div class="panel-box" style="width:100%; height:100%; display:flex; flex-direction:column;">
      <div class="panel-title">🔨 鐵匠鋪兵刃坊 (購買裝備全軍共享加成)</div>
      <div class="scroll-grid" id="forge-list"></div>
    </div>
  </div>

  <div class="modal" id="win-modal">
    <div class="modal-box">
      <h2 style="color:var(--gold); margin:0 0 10px 0;">🏆 戰役大捷！</h2>
      <p id="win-desc" style="font-size:13px; line-height:1.6; text-align:left; background:#12121b; padding:10px; border-radius:6px;"></p>
      <div id="win-reward" style="margin:12px 0; font-size:16px; color:#ffd54f; font-weight:bold;"></div>
      <button class="btn-act" style="font-size:15px; padding:8px 24px;" onclick="nextChapter()">進軍下一戰役</button>
    </div>
  </div>
</div>

<script>
function fitWindow() {
  const stage = document.getElementById('game-stage');
  const scale = Math.min((window.innerWidth - 10) / 1100, (window.innerHeight - 10) / 720);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitWindow);
window.addEventListener('load', fitWindow);

function getWeaponSvg(wKey) {
  switch(wKey) {
    case 'blade':
      return `<path d="M 68 20 Q 85 0 95 15 Q 82 25 72 35 Z" fill="#27ae60" stroke="#f1c40f" stroke-width="1.5"/><line x1="68" y1="20" x2="52" y2="75" stroke="#795548" stroke-width="3.5"/>`;
    case 'spear':
      return `<path d="M 68 15 Q 75 8 70 2 Q 62 10 65 18 Z" fill="#bdc3c7"/><line x1="66" y1="15" x2="50" y2="80" stroke="#5d4037" stroke-width="3"/>`;
    case 'halberd':
      return `<path d="M 68 10 L 76 10 L 72 0 Z" fill="#c0392b"/><path d="M 62 16 Q 72 16 72 26 Q 82 26 82 16" fill="none" stroke="#f39c12" stroke-width="2"/><line x1="72" y1="10" x2="52" y2="80" stroke="#2c3e50" stroke-width="3"/>`;
    case 'fan':
      return `<path d="M 65 45 Q 85 25 75 15 Q 60 25 65 45 Z" fill="#ecf0f1" stroke="#bdc3c7"/><line x1="65" y1="45" x2="55" y2="65" stroke="#8d6e63" stroke-width="2.5"/>`;
    case 'bow':
      return `<path d="M 68 20 Q 85 45 68 70" fill="none" stroke="#d35400" stroke-width="3"/><line x1="68" y1="20" x2="68" y2="70" stroke="#fff" stroke-dasharray="2,2"/>`;
    default:
      return `<line x1="68" y1="35" x2="88" y2="15" stroke="#f1c40f" stroke-width="3"/><line x1="65" y1="38" x2="72" y2="45" stroke="#e74c3c" stroke-width="4"/>`;
  }
}

function renderUnitSvg(fColor, aColor, hColor, wKey, isBeard) {
  return `
  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
    ${getWeaponSvg(wKey)}
    <circle cx="45" cy="40" r="22" fill="${fColor}"/>
    <circle cx="37" cy="38" r="2.5" fill="#111"/><circle cx="53" cy="38" r="2.5" fill="#111"/>
    <path d="M 23 32 Q 45 12 67 32 L 62 14 L 45 6 L 28 14 Z" fill="${hColor}"/>
    ${isBeard ? `<path d="M 33 46 Q 45 80 45 90 Q 45 80 57 46 Z" fill="#1a1a1a"/>` : `<path d="M 41 49 Q 45 53 49 49" stroke="#333" stroke-width="1.5" fill="none"/>`}
    <path d="M 12 120 L 24 64 L 68 64 L 78 120 Z" fill="${aColor}"/>
    <circle cx="58" cy="62" r="5" fill="${fColor}"/>
  </svg>`;
}

function switchTab(tKey) {
  ['battle', 'deploy', 'tavern', 'forge'].forEach(k => {
    document.getElementById(`${k}-view`).style.display = (k === tKey ? 'flex' : 'none');
    document.getElementById(`btn-tab-${k}`).classList.toggle('btn-active', k === tKey);
  });
  if(tKey === 'deploy') renderDeployList();
  if(tKey === 'tavern') renderTavernList();
  if(tKey === 'forge') renderForgeList();
  if(tKey === 'battle') renderBoard();
}

function updateGold() {
  document.getElementById('gold-hud').innerText = `💰 ${userGold}`;
  document.getElementById('deploy-hud').innerText = deployedIds.length;
}

function renderDeployList() {
  const container = document.getElementById('deploy-list');
  container.innerHTML = '';
  document.getElementById('deploy-count').innerText = deployedIds.length;

  userRoster.forEach(u => {
    const isDeployed = deployedIds.includes(u.id);
    const card = document.createElement('div');
    card.className = `card bg-${u.tier}`;
    card.innerHTML = `
      <div class="card-thumb">${renderUnitSvg(u.svg.f, u.svg.a, u.svg.h, u.svg.w, u.svg.b)}</div>
      <div style="font-weight:bold; font-size:14px;" class="tier-${u.tier}">${u.name} (★${u.stars})</div>
      <div style="font-size:11px; color:#ffd54f;">兵種: ${u.cls} | 碎片: ${u.shards}/5</div>
      <div style="font-size:11px; color:var(--dim);">攻: ${u.atk + (isDeployed?curEquip.atk:0)} | 防: ${u.def} | 血: ${u.hp}</div>
      <button style="margin-top:8px; width:100%;" class="${isDeployed?'btn-act':'btn-main'}" 
        ${u.id==='hero_avatar'?'disabled':''} onclick="toggleDeploy('${u.id}')">
        ${u.id==='hero_avatar'?'主帥鎖定':(isDeployed?'✔ 已出征 (點擊下陣)':'＋ 點擊上陣')}
      </button>
    `;
    container.appendChild(card);
  });
}

function toggleDeploy(id) {
  if(deployedIds.includes(id)) {
    deployedIds = deployedIds.filter(x => x !== id);
  } else {
    if(deployedIds.length >= 6) {
      alert("出征軍團已達 6 人滿員！請先解除其他武將。");
      return;
    }
    deployedIds.push(id);
  }
  updateGold();
  renderDeployList();
}

let currentTavernPool = [];
function rollRandomTier() {
  const roll = Math.random() * 100;
  if (roll < 1) return 'red';        // 紅將機率精準下調至 1%
  if (roll < 20) return 'purple';    // 紫將 19%
  if (roll < 55) return 'blue';      // 藍將 35%
  return 'green';                    // 綠將 45%
}

function refreshTavern(costMoney) {
  if(costMoney) {
    if(userGold < 40) { alert("銅錢不足 40！"); return; }
    userGold -= 40; updateGold();
  }
  currentTavernPool = [];
  for (let i = 0; i < 4; i++) {
    const t = rollRandomTier();
    const candidates = HERO_NAMES.filter(h => h.t === t);
    const chosen = candidates[Math.floor(Math.random() * candidates.length)] || HERO_NAMES[0];
    currentTavernPool.push(chosen);
  }
  renderTavernList();
}
refreshTavern(false);

function renderTavernList() {
  const container = document.getElementById('tavern-list');
  container.innerHTML = '';
  currentTavernPool.forEach((h, idx) => {
    const cost = TIER_PRICES[h.t];
    const exist = userRoster.find(u => u.name === h.n);
    const card = document.createElement('div');
    card.className = `card bg-${h.t}`;
    card.innerHTML = `
      <div class="card-thumb">${renderUnitSvg(h.f, h.a, h.h, h.w, h.b)}</div>
      <div style="font-weight:bold; font-size:14px;" class="tier-${h.t}">${h.n}</div>
      <div style="font-size:11px; color:#ffca28;">品階: ${h.t.toUpperCase()} | 戰技: ${h.s}</div>
      <div style="font-size:11px; color:var(--dim); margin:4px 0;">
        ${exist ? `軍中在冊 (★${exist.stars} 碎片:${exist.shards}/5)` : '尚未結納'}
      </div>
      <button class="btn-main" onclick="buyHero(${idx})">💰 ${cost} 銅錢 ${exist?'+3碎片':'招攬'}</button>
    `;
    container.appendChild(card);
  });
}

function buyHero(idx) {
  const h = currentTavernPool[idx];
  const cost = TIER_PRICES[h.t];
  if(userGold < cost) { alert(`銅錢不足 ${cost}！`); return; }

  userGold -= cost; updateGold();
  const exist = userRoster.find(u => u.name === h.n);
  if(exist) {
    exist.shards += 3;
    let upMsg = `${h.n} 獲得 3 枚將魂碎片 (當前: ${exist.shards}/5)！`;
    while(exist.shards >= 5) {
      exist.shards -= 5;
      exist.stars += 1;
      exist.atk += 12;
      exist.hp += 40;
      exist.def += 10;
      upMsg += `\n✨ 將魂突破！【${exist.name}】升星至 ★${exist.stars}！攻防氣血大幅精進！`;
    }
    alert(upMsg);
  } else {
    userRoster.push({
      id: "hero_" + h.n, name: h.n, cls: h.c, tier: h.t,
      stars: 1, shards: 0, weapon: h.w,
      hp: h.t==='red'?320:250, atk: h.t==='red'?62:48, def: h.t==='red'?38:30,
      skillName: h.s, skType: h.skType,
      svg: { f: h.f, a: h.a, h: h.h, w: h.w, b: h.b }
    });
    alert(`🎉 成功延攬大將【${h.n}】！可至「軍團備戰」部署上陣。`);
  }
  renderTavernList();
}

    isBoss: true, hasMoved: false, acted: false, skillCd: 0,
    skillName: "主帥猛擊", skType: "dmg",
    svg: { f: ch.bossSvg.f, a: ch.bossSvg.a, h: ch.bossSvg.h, w: ch.bossSvg.w, b: ch.bossSvg.b },
    tier: ch.bossTier
  });

  const enemyLayouts = [
    { x: 3, y: 1, cls: "Shieldman", w: "spear", c: "#37474f" },
    { x: 2, y: 1, cls: "Spearman", w: "spear", c: "#5d4037" },
    { x: 4, y: 1, cls: "Swordsman", w: "blade", c: "#424242" },
    { x: 2, y: 0, cls: "Archer", w: "bow", c: "#2c3e50" },
    { x: 4, y: 0, cls: "Archer", w: "bow", c: "#2c3e50" }
  ];

  const minionCount = Math.min(enemyLayouts.length, ch.enemyMinions.length);
  for(let i=0; i<minionCount; i++) {
    const mName = ch.enemyMinions[i];
    const layout = enemyLayouts[i];
    battleUnits.push({
      id: `m_${chIdx}_${i}`, name: mName, cls: layout.cls, faction: 'enemy',
      x: layout.x, y: layout.y,
      hp: Math.round(ch.hp * 0.5), maxHp: Math.round(ch.hp * 0.5),
      baseAtk: Math.round(ch.atk * 0.75), baseDef: Math.round(ch.def * 0.85),
      atk: Math.round(ch.atk * 0.75), def: Math.round(ch.def * 0.85),
      buffTurns: 0, defTurns: 0,
      isBoss: false, hasMoved: false, acted: false, skillCd: 0,
      svg: { f: "#8d6e63", a: layout.c, h: "#212121", w: layout.w, b: false },
      tier: "green"
    });
  }

  log(`=== 【${ch.title}】開戰！敵軍 ${minionCount+1} 人結成陣勢！===`);
  selectedUnit = battleUnits[0];
  renderBoard();
}

function log(msg) {
  const el = document.getElementById('battle-log');
  el.innerHTML += `<div>> ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function renderBoard() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for(let y=0; y<6; y++) {
    for(let x=0; x<6; x++) {
      const cell = document.createElement('div');
      const t = (x===2&&y===2)||(x===3&&y===2)?'fort':((x+y)%4===1?'forest':'plains');
      cell.className = `cell ${t}`;
      cell.onclick = () => onCellClick(x, y);

      const u = battleUnits.find(b => b.x === x && b.y === y && b.hp > 0);
      if(u) {
        cell.classList.add('cell-unit', u.faction==='player'?'unit-p':'unit-e');
        if(u.isBoss) cell.classList.add('unit-e-boss');
        if(u.defTurns > 0) cell.classList.add('unit-shielded');
        if(u === selectedUnit) cell.classList.add('cell-selected');
        if(u.hasMoved && !u.acted) cell.classList.add('cell-moved');
        if(u.acted) cell.classList.add('cell-acted');
        cell.innerHTML = `<strong>${u.name}</strong><span style="font-size:9.5px">${u.hp}/${u.maxHp}</span>`;
      }
      grid.appendChild(cell);
    }
  }
  updateRightConsole();
}

function updateRightConsole() {
  const avBox = document.getElementById('cur-avatar');
  const infoBox = document.getElementById('cur-info');
  const skillBox = document.getElementById('cur-skills');
  skillBox.innerHTML = '';

  if(!selectedUnit) {
    avBox.innerHTML = ''; infoBox.innerHTML = '點擊棋子檢視軍情'; return;
  }
  const u = selectedUnit;
  avBox.innerHTML = renderUnitSvg(u.svg.f, u.svg.a, u.svg.h, u.svg.w, u.svg.b);
  infoBox.innerHTML = `
    <div style="font-size:14px; font-weight:bold;" class="tier-${u.tier}">${u.name} (${u.cls})</div>
    <div>生命: <strong style="color:var(--c-green);">${u.hp}</strong> / ${u.maxHp}</div>
    <div>攻擊: ${u.atk} ${u.buffTurns>0?'<span style="color:#f1c40f;">[增益中]</span>':''} | 防禦: ${u.def} ${u.defTurns>0?'<span style="color:#3498db;">[防護中]</span>':''}</div>
    <div style="color:var(--gold); font-size:11px;">
      ${u.cls === 'Archer' ? '🎯 特性：射程 2~3 格（貼身 1 格盲區不可攻擊）' : '⚔ 特性：近身 1 格突擊'}
    </div>
    <div style="color:${u.acted?'#e74c3c':(u.hasMoved?'#f1c40f':'#2ecc71')}">
      ${u.acted?'本回合已行動':(u.hasMoved?'已走位 (可攻擊或待命)':'待命中 (可移動)')}
    </div>
  `;

  if(u.faction === 'player' && !u.acted && !isEnemyPhase) {
    const btnSk = document.createElement('button');
    btnSk.className = 'btn-skill';
    btnSk.innerHTML = `⚡ 戰技：${u.skillName} ${u.skillCd>0?`(${u.skillCd}CD)`:'[釋放]'}`;
    btnSk.disabled = u.skillCd > 0;
    btnSk.onclick = () => executeSkill(u);
    skillBox.appendChild(btnSk);

    const btnWait = document.createElement('button');
    btnWait.style.width = '100%';
    btnWait.innerText = u.hasMoved ? '🛑 就地待命' : '🛡 原地戒備';
    btnWait.onclick = () => finishAction(u);
    skillBox.appendChild(btnWait);
  }
}

function executeSkill(u) {
  // 1. 太史慈 貫日連珠 穿透兩名敵軍
  if (u.skType === 'pierce') {
    const enemies = battleUnits.filter(e => e.faction === 'enemy' && e.hp > 0);
    const dirs = [{dx:1, dy:0}, {dx:-1, dy:0}, {dx:0, dy:1}, {dx:0, dy:-1}];
    let bestLine = null;

    for (const d of dirs) {
      const lineHits = [];
      for (let step = 1; step <= 4; step++) {
        const tx = u.x + d.dx * step;
        const ty = u.y + d.dy * step;
        const hit = enemies.find(e => e.x === tx && e.y === ty);
        if (hit) {
          lineHits.push(hit);
          if (lineHits.length === 2) break;
        }
      }
      if (lineHits.length >= 2) {
        bestLine = lineHits;
        break;
      } else if (lineHits.length === 1 && !bestLine) {
        bestLine = lineHits;
      }
    }

    if (!bestLine || bestLine.length === 0) {
      alert("太史慈直線上無有效目標！請走位至與敵軍直線對齊位置。");
      return;
    }

    u.skillCd = 2;
    bestLine.forEach((target, idx) => {
      const dmg = Math.max(1, Math.round(u.atk * (1.6 - idx * 0.2) - target.def * 0.4));
      target.hp -= dmg;
      log(`🏹 太史慈狂放【貫日連珠】，神矢呼嘯貫穿第 ${idx+1} 號目標 ${target.name}，造成 ${dmg} 點穿透打擊！`);
      if (target.hp <= 0) log(`☠ 敵將【${target.name}】被貫日箭洞穿落馬！`);
    });
    finishAction(u);
    return;
  }

  // 2. 增益技能 (Buff): 全體或周圍攻擊提升
  if (u.skType === 'buff') {
    u.skillCd = 3;
    const allies = battleUnits.filter(a => a.faction === 'player' && a.hp > 0 && Math.abs(a.x - u.x) + Math.abs(a.y - u.y) <= 2);
    allies.forEach(a => {
      a.buffTurns = 2;
      a.atk = Math.round(a.baseAtk * 1.3);
    });
    log(`✨ ${u.name} 施展【${u.skillName}】，鼓舞軍心！周圍友軍攻擊力提升 30%（持續 2 回合）！`);
    finishAction(u);
    return;
  }

  // 3. 防禦技能 (Defense): 自身及友軍護盾與防禦強化
  if (u.skType === 'def') {
    u.skillCd = 3;
    const allies = battleUnits.filter(a => a.faction === 'player' && a.hp > 0 && Math.abs(a.x - u.x) + Math.abs(a.y - u.y) <= 2);
    allies.forEach(a => {
      a.defTurns = 2;
      a.def = Math.round(a.baseDef * 1.5);
    });
    log(`🛡 ${u.name} 展開【${u.skillName}】，列陣嚴防！周圍部隊防禦力暴增 50%（持續 2 回合）！`);
    finishAction(u);
    return;
  }

  // 4. 普通單體或常規打擊戰技 (Damage)
  const isArc = u.cls === 'Archer';
  const target = battleUnits.find(e => {
    if (e.faction !== 'enemy' || e.hp <= 0) return false;
    const d = Math.abs(e.x - u.x) + Math.abs(e.y - u.y);
    return isArc ? (d >= 2 && d <= 3) : (d <= 1);
  });
  if(!target) {
    alert(isArc ? "射程 2~3 格內無目標（貼身 1 格不可釋放）！" : "身邊 1 格內沒有敵軍可釋放戰技！");
    return;
  }
  u.skillCd = 2;
  const dmg = Math.round(u.atk * 1.8 - target.def * 0.4);
  target.hp -= dmg;
  log(`💥 ${u.name} 暴起突刺【${u.skillName}】，撕裂 ${target.name} 造成 ${dmg} 點巨創！`);
  finishAction(u);
}

function onCellClick(x, y) {
  if(isEnemyPhase) return;
  const clicked = battleUnits.find(u => u.x === x && u.y === y && u.hp > 0);

  if(clicked && clicked.faction === 'player' && !clicked.acted) {
    selectedUnit = clicked; renderBoard(); return;
  }

  if(selectedUnit && selectedUnit.faction === 'player' && !selectedUnit.acted) {
    const dist = Math.abs(x - selectedUnit.x) + Math.abs(y - selectedUnit.y);
    if(clicked && clicked.faction === 'enemy') {
      if (selectedUnit.cls === 'Archer') {
        if (dist === 1) {
          log("❌ 弓兵盲區：敵人已逼近身前 1 格，無法拉弓射擊！");
          return;
        }
        if (dist > 3) {
          log("❌ 超出弓矢極限射程（最大 3 格）！");
          return;
        }
      } else {
        if (dist > 1) {
          log("❌ 近戰兵刃距離不足（射程 1 格）！");
          return;
        }
      }

      const dmg = Math.max(1, selectedUnit.atk - clicked.def);
      clicked.hp -= dmg;
      log(`⚔ ${selectedUnit.name} 發動打擊，對 ${clicked.name} 造成 ${dmg} 傷害！`);
      if(clicked.hp <= 0) log(`☠ 敵將【${clicked.name}】身負重創被斬落馬下！`);
      finishAction(selectedUnit);
      return;
    }

    if(!clicked && !selectedUnit.hasMoved) {
      if(dist <= 3) {
        selectedUnit.x = x; selectedUnit.y = y; selectedUnit.hasMoved = true;
        renderBoard(); return;
      }
    }
  }
  if(clicked) { selectedUnit = clicked; renderBoard(); }
}

function finishAction(u) {
  u.acted = true; u.hasMoved = true; selectedUnit = null; renderBoard();
  if(checkBattleResult()) return;

  const aliveP = battleUnits.filter(b => b.faction === 'player' && b.hp > 0 && !b.acted);
  if(aliveP.length === 0) {
    setTimeout(enemyTurn, 500);
  }
}

function enemyTurn() {
  isEnemyPhase = true;
  document.getElementById('turn-txt').innerText = `回合 ${turn} (敵軍反撲)`;
  log(`--- 敵軍陣列全線反擊 ---`);

  const enemies = battleUnits.filter(e => e.faction === 'enemy' && e.hp > 0);
  const players = battleUnits.filter(p => p.faction === 'player' && p.hp > 0);

  enemies.forEach(e => {
    if(players.length === 0) return;
    const isArc = e.cls === 'Archer';

    if (isArc) {
      const shootTarget = players.find(p => {
        const d = Math.abs(p.x - e.x) + Math.abs(p.y - e.y);
        return d >= 2 && d <= 3;
      });

      if (shootTarget) {
        const dmg = Math.max(1, e.atk - shootTarget.def);
        shootTarget.hp -= dmg;
        log(`🏹 敵方弓兵【${e.name}】精準狙射 ${shootTarget.name}，造成 ${dmg} 點遠程傷害！`);
        if(shootTarget.hp <= 0) log(`☠ 我方大將【${shootTarget.name}】重傷暫退戰線！`);
        return;
      }

      const closeP = players.find(p => (Math.abs(p.x - e.x) + Math.abs(p.y - e.y)) === 1);
      if (closeP) {
        const awayDirs = [
          { dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }
        ].sort((a,b) => {
          const d1 = Math.abs((e.x+b.dx)-closeP.x) + Math.abs((e.y+b.dy)-closeP.y);
          const d2 = Math.abs((e.x+a.dx)-closeP.x) + Math.abs((e.y+a.dy)-closeP.y);
          return d1 - d2;
        });

        for (const dir of awayDirs) {
          const nx = e.x + dir.dx;
          const ny = e.y + dir.dy;
          if (nx >= 0 && nx < 6 && ny >= 0 && ny < 6 && !battleUnits.some(u => u.x === nx && u.y === ny && u.hp > 0)) {
            e.x = nx; e.y = ny;
            log(`💨 敵方弓手【${e.name}】被近身，緊急後撤拉開射程！`);
            break;
          }
        }
        return;
      }
    }

    const target = players.sort((a,b) => (Math.abs(a.x-e.x)+Math.abs(a.y-e.y)) - (Math.abs(b.x-e.x)+Math.abs(b.y-e.y)))[0];
    const dist = Math.abs(target.x - e.x) + Math.abs(target.y - e.y);

    if(!isArc && dist <= 1) {
      const dmg = Math.max(1, e.atk - target.def);
      target.hp -= dmg;
      log(`👹 ${e.name} 揮兵突刺 ${target.name}，造成 ${dmg} 點打擊！`);
      if(target.hp <= 0) log(`☠ 我方大將【${target.name}】身負重傷，暫退戰線！`);
    } else {
      const dx = target.x > e.x ? 1 : (target.x < e.x ? -1 : 0);
      const dy = target.y > e.y ? 1 : (target.y < e.y ? -1 : 0);
      if(!battleUnits.some(u => u.x === e.x+dx && u.y === e.y && u.hp > 0)) e.x += dx;
      else if(!battleUnits.some(u => u.x === e.x && u.y === e.y+dy && u.hp > 0)) e.y += dy;
    }
  });

  battleUnits.forEach(u => {
    if(u.faction === 'player') {
      u.acted = false; u.hasMoved = false;
      if(u.skillCd > 0) u.skillCd--;
      if(u.buffTurns > 0) {
        u.buffTurns--;
        if(u.buffTurns === 0) u.atk = u.baseAtk;
      }
      if(u.defTurns > 0) {
        u.defTurns--;
        if(u.defTurns === 0) u.def = u.baseDef;
      }
    }
  });

  turn++; isEnemyPhase = false;
  document.getElementById('turn-txt').innerText = `回合 ${turn} (玩家行動)`;
  renderBoard();
  checkBattleResult();
}

function checkBattleResult() {
  const boss = battleUnits.find(u => u.faction === 'enemy' && u.isBoss && u.hp > 0);
  if(!boss) {
    const ch = CHAPTERS[curChapterIdx];
    userGold += ch.reward; updateGold();
    document.getElementById('win-desc').innerText = `敵軍主帥【${ch.bossName}】戰敗潰散，敵軍全線瓦解！奪下戰略重鎮！\n\n歷史紀元：${ch.story}`;
    document.getElementById('win-reward').innerText = `💰 繳獲軍資賞賜 +${ch.reward} 銅錢！`;
    document.getElementById('win-modal').style.display = 'flex';
    return true;
  }
  const avatar = battleUnits.find(u => u.id === 'hero_avatar' && u.hp > 0);
  if(!avatar) {
    alert("💥 主角戰陣陷落！全軍潰退，請重整旗鼓再來！");
    location.reload();
    return true;
  }
  return false;
}

function nextChapter() {
  document.getElementById('win-modal').style.display = 'none';
  if(curChapterIdx < 49) {
    curChapterIdx++;
    initChapter(curChapterIdx);
  } else {
    alert("👑 恭喜你！歷經 50 場史詩大戰，從黃巾亂世戰至三家歸晉，全圖一統！");
    location.reload();
  }
}

initChapter(0);
updateGold();
</script>
