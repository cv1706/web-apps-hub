  <script>
    const TRIP = JSON.parse(document.getElementById('raw-trip-data').textContent);
    const TRIP_SLUG = TRIP.meta.slug || 'guide';
    let activeDay = 1;
    let itineraryChecks = {};
    let checklistChecks = {};

    function loadState() {
      try {
        const it = localStorage.getItem(`itin_checks_${TRIP_SLUG}`);
        if (it) itineraryChecks = JSON.parse(it);
        const chk = localStorage.getItem(`chk_checks_${TRIP_SLUG}`);
        if (chk) checklistChecks = JSON.parse(chk);
      } catch (e) {}
    }

    function saveItineraryState() {
      try { localStorage.setItem(`itin_checks_${TRIP_SLUG}`, JSON.stringify(itineraryChecks)); } catch(e) {}
    }
    function saveChecklistState() {
      try { localStorage.setItem(`chk_checks_${TRIP_SLUG}`, JSON.stringify(checklistChecks)); } catch(e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2200);
    }

    function copyToClipboard(text, msg = '已複製至剪貼簿') {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast(msg));
      } else {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        showToast(msg);
      }
    }

    function openDriverModal(title, addr, note = '') {
      document.getElementById('modal-jp-title').textContent = title;
      document.getElementById('modal-jp-addr').textContent = addr;
      document.getElementById('modal-jp-note').textContent = note;

      const query = encodeURIComponent((addr || '') + ' ' + (title || ''));
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${query}`;

      const addrLink = document.getElementById('modal-addr-link');
      if (addrLink) addrLink.href = mapsUrl;
      const mapsBtn = document.getElementById('modal-maps-btn');
      if (mapsBtn) mapsBtn.href = mapsUrl;

      const modal = document.getElementById('driver-modal');
      modal.classList.remove('hidden');
      document.getElementById('modal-copy-btn').onclick = () => copyToClipboard(addr, '已複製地址！');
    }
    document.getElementById('modal-close-btn').addEventListener('click', () => {
      document.getElementById('driver-modal').classList.add('hidden');
    });

    // TAB CONTROLS
    const tabBtns = document.querySelectorAll('.main-tab-btn');
    const sections = {
      itinerary: document.getElementById('tab-itinerary'),
      food: document.getElementById('tab-food'),
      transport: document.getElementById('tab-transport'),
      tickets: document.getElementById('tab-tickets'),
      checklist: document.getElementById('tab-checklist')
    };

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-main-tab');
        tabBtns.forEach(b => {
          b.className = 'main-tab-btn shrink-0 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 transition';
        });
        btn.className = 'main-tab-btn shrink-0 rounded-xl bg-slate-900 text-white px-3.5 py-1.5 shadow-sm transition';
        Object.keys(sections).forEach(k => {
          if (sections[k]) {
            if (k === tab) {
              sections[k].classList.remove('hidden');
            } else {
              sections[k].classList.add('hidden');
            }
          }
        });
      });
    });

    // RENDER ITINERARY
    function renderItineraryDayButtons() {
      const container = document.getElementById('itinerary-day-buttons');
      container.innerHTML = '';
      TRIP.itinerary.forEach(d => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = (activeDay === d.day)
          ? 'shrink-0 rounded-lg bg-sky-700 px-3 py-1.5 text-xs font-bold text-white shadow-sm transition'
          : 'shrink-0 rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-200 transition';
        btn.textContent = d.date || `Day ${d.day}`;
        btn.onclick = () => {
          activeDay = d.day;
          renderItineraryDayButtons();
          renderItineraryList();
        };
        container.appendChild(btn);
      });
    }

    function renderItineraryList() {
      const container = document.getElementById('itinerary-timeline-container');
      container.innerHTML = '';
      const days = (activeDay === 'all')
        ? TRIP.itinerary
        : TRIP.itinerary.filter(d => d.day === activeDay);

      days.forEach(d => {
        const card = document.createElement('div');
        card.className = 'rounded-2xl bg-white p-5 shadow-sm border border-slate-200 space-y-3';
        let stopsHtml = '';
        d.stops.forEach(s => {
          const isDone = !!itineraryChecks[s.id];
          stopsHtml += `
            <div class="relative pl-6 pb-4 border-l-2 border-slate-200 last:border-none last:pb-0">
              <span class="absolute -left-[9px] top-0.5 h-4 w-4 rounded-full border-2 border-white ${isDone ? 'bg-emerald-500' : 'bg-slate-300'}"></span>
              <div class="flex items-start justify-between gap-2">
                <div class="space-y-1">
                  <div class="flex items-center gap-2">
                    <span class="rounded bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-700">${s.time}</span>
                    <span class="rounded bg-sky-100 px-2 py-0.5 text-xs font-semibold text-sky-800">${s.tag || '景點'}</span>
                  </div>
                  <h4 class="text-sm font-bold ${isDone ? 'line-through text-slate-400' : 'text-slate-900'}">${s.title}</h4>
                  ${s.desc ? `<p class="text-xs text-slate-600 leading-relaxed">${s.desc}</p>` : ''}
                </div>
                <label class="cursor-pointer shrink-0">
                  <input type="checkbox" class="stop-chk h-4 w-4 rounded border-slate-300 text-sky-700" data-id="${s.id}" ${isDone ? 'checked' : ''}>
                </label>
              </div>
              <div class="mt-2.5 flex items-center gap-2">
                ${s.jpAddr ? `
                  <button type="button" class="driver-trigger rounded-lg bg-sky-50 text-sky-700 border border-sky-200 px-2.5 py-1 text-xs font-bold hover:bg-sky-100 transition" data-title="${s.jpTitle || s.title}" data-addr="${s.jpAddr}" data-note="${s.jpNote || ''}">
                    司機卡
                  </button>
                  <button type="button" class="copy-trigger rounded-lg bg-slate-100 text-slate-700 px-2.5 py-1 text-xs font-semibold hover:bg-slate-200 transition" data-addr="${s.jpAddr}">
                    複製地址
                  </button>
                ` : ''}
                ${s.linkUrl ? `
                  <a href="${s.linkUrl}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-sky-700 hover:underline">
                    ${s.linkText || '官網地圖'} &nearr;
                  </a>
                ` : ''}
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div>
              <span class="text-xs font-bold text-sky-700 uppercase tracking-wider">${d.date}</span>
              <h3 class="text-base font-bold text-slate-900">${d.title}</h3>
            </div>
          </div>
          <div class="pt-2">${stopsHtml}</div>
        `;

        card.querySelectorAll('.stop-chk').forEach(chk => {
          chk.addEventListener('change', (e) => {
            const id = e.target.getAttribute('data-id');
            itineraryChecks[id] = e.target.checked;
            saveItineraryState();
            renderItineraryList();
          });
        });

        card.querySelectorAll('.driver-trigger').forEach(b => {
          b.addEventListener('click', () => {
            openDriverModal(b.getAttribute('data-title'), b.getAttribute('data-addr'), b.getAttribute('data-note'));
          });
        });

        card.querySelectorAll('.copy-trigger').forEach(b => {
          b.addEventListener('click', () => {
            copyToClipboard(b.getAttribute('data-addr'));
          });
        });

        container.appendChild(card);
      });
    }

    document.getElementById('expand-all-days-btn').addEventListener('click', (e) => {
      if (activeDay === 'all') {
        activeDay = 1;
        e.target.textContent = '展開全部總覽';
      } else {
        activeDay = 'all';
        e.target.textContent = '收合單日瀏覽';
      }
      renderItineraryDayButtons();
      renderItineraryList();
    });

    // RENDER FOOD
    function renderFood(filterDay = 'all') {
      const container = document.getElementById('food-grid-container');
      container.innerHTML = '';
      const list = (filterDay === 'all')
        ? TRIP.food
        : TRIP.food.filter(f => f.day === parseInt(filterDay, 10));

      list.forEach(f => {
        const card = document.createElement('div');
        card.className = 'rounded-2xl bg-white p-5 shadow-sm border border-slate-200 flex flex-col justify-between space-y-3';
        card.innerHTML = `
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="rounded-md bg-amber-100 text-amber-800 px-2 py-0.5 text-xs font-bold">${f.dayLabel || `Day ${f.day}`}</span>
              <span class="text-xs text-slate-400 font-medium">${f.catLabel || '特色美食'}</span>
            </div>
            <h3 class="text-base font-bold text-slate-900">${f.name}</h3>
            ${f.jpName ? `<p class="text-xs text-sky-800 font-medium">${f.jpName}</p>` : ''}
            ${f.feature ? `<p class="text-xs text-slate-600 leading-relaxed">${f.feature}</p>` : ''}
            ${f.mustOrder ? `
              <div class="rounded-xl bg-slate-50 p-2.5 border border-slate-100 text-xs">
                <span class="font-bold text-slate-700">必點名物：</span>
                <span class="text-slate-600">${f.mustOrder}</span>
              </div>
            ` : ''}
            ${f.jpAddress ? `<p class="text-xs text-slate-500"><span class="font-medium">地址：</span>${f.jpAddress}</p>` : ''}
          </div>
          <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
            <div class="flex gap-2">
              ${f.jpAddress ? `
                <button type="button" class="food-driver-btn rounded-xl bg-sky-700 text-white px-3 py-1.5 text-xs font-bold hover:bg-sky-800 transition">
                  司機卡
                </button>
                <button type="button" class="food-copy-btn rounded-xl bg-slate-100 text-slate-700 px-3 py-1.5 text-xs font-semibold hover:bg-slate-200 transition">
                  複製地址
                </button>
              ` : ''}
            </div>
            ${f.url ? `<a href="${f.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-sky-700 hover:underline">地圖官網 &nearr;</a>` : ''}
          </div>
        `;

        const driverBtn = card.querySelector('.food-driver-btn');
        if (driverBtn) {
          driverBtn.onclick = () => openDriverModal(f.jpName || f.name, f.jpAddress, '定位導航');
        }
        const copyBtn = card.querySelector('.food-copy-btn');
        if (copyBtn) {
          copyBtn.onclick = () => copyToClipboard(f.jpAddress);
        }
        container.appendChild(card);
      });
    }

    function renderFoodFilters() {
      const container = document.getElementById('food-day-filters');
      container.innerHTML = '';
      const days = [...new Set(TRIP.food.map(f => f.day))].sort((a,b)=>a-b);
      const allBtn = document.createElement('button');
      allBtn.className = 'food-day-filter shrink-0 rounded-lg bg-sky-700 px-2.5 py-1 text-xs font-bold text-white';
      allBtn.textContent = '全部';
      allBtn.onclick = () => {
        document.querySelectorAll('.food-day-filter').forEach(b => b.className = 'food-day-filter shrink-0 rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-200');
        allBtn.className = 'food-day-filter shrink-0 rounded-lg bg-sky-700 px-2.5 py-1 text-xs font-bold text-white';
        renderFood('all');
      };
      container.appendChild(allBtn);

      days.forEach(d => {
        const b = document.createElement('button');
        b.className = 'food-day-filter shrink-0 rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-200';
        b.textContent = `D${d}`;
        b.onclick = () => {
          document.querySelectorAll('.food-day-filter').forEach(x => x.className = 'food-day-filter shrink-0 rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-200');
          b.className = 'food-day-filter shrink-0 rounded-lg bg-sky-700 px-2.5 py-1 text-xs font-bold text-white';
          renderFood(d);
        };
        container.appendChild(b);
      });
    }

    // RENDER TRANSPORT & TICKETS
    function renderTransport() {
      const tbody = document.getElementById('transport-table-body');
      tbody.innerHTML = '';
      TRIP.transport.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-3 px-3 font-semibold text-slate-900">${t.route}</td>
          <td class="py-3 px-3">${t.tool}</td>
          <td class="py-3 px-3 text-sky-800 font-semibold">${t.price}</td>
          <td class="py-3 px-3 leading-relaxed">${t.note}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderTickets() {
      const tbody = document.getElementById('tickets-table-body');
      tbody.innerHTML = '';
      TRIP.tickets.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-3 px-3 font-semibold text-slate-900">${t.spot}</td>
          <td class="py-3 px-3">${t.time}</td>
          <td class="py-3 px-3 text-sky-800 font-semibold">${t.price}</td>
          <td class="py-3 px-3 leading-relaxed">${t.note}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // RENDER CHECKLIST
    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      container.innerHTML = '';
      let total = 0;
      let done = 0;

      TRIP.checklist.forEach(g => {
        const card = document.createElement('div');
        card.className = 'rounded-2xl border border-slate-200 bg-white p-4 space-y-3';
        let itemsHtml = '';
        g.items.forEach(it => {
          total++;
          const isChecked = !!checklistChecks[it.id];
          if (isChecked) done++;
          itemsHtml += `
            <label class="flex items-start gap-2.5 p-2 rounded-xl hover:bg-slate-50 cursor-pointer transition">
              <input type="checkbox" class="chk-item mt-0.5 h-4 w-4 rounded border-slate-300 text-sky-700" data-id="${it.id}" ${isChecked ? 'checked' : ''}>
              <span class="text-xs sm:text-sm ${isChecked ? 'line-through text-slate-400' : 'text-slate-700'}">
                ${it.label}
              </span>
            </label>
          `;
        });

        card.innerHTML = `
          <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">${g.category}</h3>
          <div class="space-y-1">${itemsHtml}</div>
        `;

        card.querySelectorAll('.chk-item').forEach(chk => {
          chk.addEventListener('change', (e) => {
            const id = e.target.getAttribute('data-id');
            checklistChecks[id] = e.target.checked;
            saveChecklistState();
            renderChecklist();
          });
        });

        container.appendChild(card);
      });

      document.getElementById('checklist-progress-badge').textContent = `已完成 ${done} / ${total}`;
    }

    document.getElementById('quick-driver-btn').onclick = () => {
      let s = null;
      if (activeDay !== 'all') {
        const d = TRIP.itinerary.find(x => x.day === activeDay);
        if (d && d.stops) s = d.stops.find(st => st.jpAddr);
      }
      if (!s && TRIP.itinerary[0] && TRIP.itinerary[0].stops) {
        s = TRIP.itinerary[0].stops.find(st => st.jpAddr) || TRIP.itinerary[0].stops[0];
      }
      if (s) {
        openDriverModal(s.jpTitle || s.title, s.jpAddr || '目的地詳細地址', s.jpNote || '');
      } else {
        showToast('暫無司機資訊');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderItineraryDayButtons();
      renderItineraryList();
      renderFoodFilters();
      renderFood('all');
      renderTransport();
      renderTickets();
      renderChecklist();
    });
  </script>
</body>
</html>
