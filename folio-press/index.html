<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>印務室 Folio Press — AI 對話轉顧問報告與高階 A4 排版工作台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%2232%22%20height=%2232%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231E3A5F%22/><text x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22serif%22 font-weight=%22bold%22>F</text></svg>">

  <!-- Google Fonts & Pretendard -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- KaTeX for Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>

  <!-- html2canvas for Long Image Export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Noto Sans TC', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            serif: ['Noto Serif TC', 'Georgia', 'Nanum Myeongjo', 'serif'],
            mono: ['DM Mono', 'Consolas', 'monospace'],
          },
          colors: {
            brand: {
              50: '#F0F4F8',
              100: '#D9E2EC',
              500: '#1E3A5F',
              600: '#152C49',
              900: '#0B192C',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* =========================================================
       THEME SYSTEM VARIABLES (100% 勾稽原版 6 大主題架構)
       ========================================================= */
    :root {
      --font-sans: 'Pretendard', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Noto Serif TC', Georgia, 'Nanum Myeongjo', serif;
      --font-mono: 'DM Mono', Consolas, monospace;
    }

    /* 01 瑞士顧問 (Swiss Corporate) */
    [data-theme="swiss"] {
      --paper: #FFFFFF;
      --ink: #111113;
      --muted: #6B6B70;
      --accent: #1E3A5F;
      --accent-tint: #F2F4F7;
      --rule: #E3E6EA;
      --canvas-bg: #E4E2DD;
      --font-head: var(--font-sans);
      --font-body: var(--font-sans);
    }

    /* 02 聖水象牙 (Seongsu Ivory) */
    [data-theme="seongsu"] {
      --paper: #FAF8F5;
      --ink: #282625;
      --muted: #78726D;
      --accent: #3E5A47;
      --accent-tint: #F0EDE6;
      --rule: #E4DFD5;
      --canvas-bg: #E6E1D8;
      --font-head: var(--font-serif);
      --font-body: var(--font-sans);
    }

    /* 03 東京雜誌 (Tokyo Magazine) */
    [data-theme="tokyo"] {
      --paper: #FDFBF7;
      --ink: #1F1D1A;
      --muted: #6E6A63;
      --accent: #B33A1E;
      --accent-tint: #F8F1EA;
      --rule: #E7DFD2;
      --canvas-bg: #E4DED4;
      --font-head: var(--font-serif);
      --font-body: var(--font-sans);
    }

    /* 04 金融簡報 (Financial Briefing) */
    [data-theme="ft"] {
      --paper: #FFFFFF;
      --ink: #0F172A;
      --muted: #475569;
      --accent: #0F2942;
      --accent-tint: #EEF2F7;
      --rule: #D7DEE8;
      --canvas-bg: #DFE3E9;
      --font-head: var(--font-sans);
      --font-body: var(--font-sans);
    }

    /* 05 牛津學術 (Oxford Academic) */
    [data-theme="oxford"] {
      --paper: #FCFCFA;
      --ink: #141413;
      --muted: #575653;
      --accent: #7C2D12;
      --accent-tint: #F4F2EC;
      --rule: #DAD6CE;
      --canvas-bg: #E3E1DB;
      --font-head: var(--font-serif);
      --font-body: var(--font-serif);
    }

    /* 00 對話原貌 (Chat Transcript) */
    [data-theme="chat"] {
      --paper: #FFFFFF;
      --ink: #0D0D0D;
      --muted: #6B6B6B;
      --accent: #2F2F2F;
      --accent-tint: #F4F4F4;
      --rule: #E5E5E5;
      --canvas-bg: #E9E8E6;
      --font-head: var(--font-sans);
      --font-body: var(--font-sans);
    }

    /* Base Typography Scaling */
    .scale-small { --base: 12px; }
    .scale-normal { --base: 13.5px; }
    .scale-large { --base: 15px; }

    /* =========================================================
       PAGE & PAPER SIMULATION (A4 / LETTER)
       ========================================================= */
    .pages-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 40px 0;
      transform-origin: top center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .page {
      position: relative;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: var(--base);
      line-height: 1.7;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 20px 25px -5px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      box-sizing: border-box;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* A4 Standards (794px x 1123px at 96 DPI) */
    .page.size-a4 {
      width: 794px;
      height: 1123px;
    }

    /* US Letter (816px x 1056px at 96 DPI) */
    .page.size-letter {
      width: 816px;
      height: 1056px;
    }

    /* Running Header */
    .page-head {
      position: absolute;
      top: 32px;
      left: 64px;
      right: 64px;
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 6px;
      font-family: var(--font-body);
      user-select: none;
    }

    /* Body Container */
    .page-body {
      position: absolute;
      top: 84px;
      left: 64px;
      right: 64px;
      bottom: 72px;
      overflow: hidden;
    }

    /* Running Footer */
    .page-foot {
      position: absolute;
      bottom: 30px;
      left: 64px;
      right: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      font-size: 10.5px;
      color: var(--muted);
      border-top: 1px solid var(--rule);
      padding-top: 8px;
      font-family: var(--font-body);
      user-select: none;
    }

    .page-foot .pf-l {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-foot .pf-c {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }
    .page-foot .pf-r {
      opacity: 0.8;
      justify-self: end;
      white-space: nowrap;
    }

    /* =========================================================
       THEME SPECIFIC OVERRIDES & ACCENTS
       ========================================================= */

    /* [01 瑞士顧問] */
    [data-theme="swiss"] .cover {
      border-top: 5px solid var(--accent);
      padding-top: calc(var(--base) * 1.5);
      border-bottom: 1px solid var(--rule);
      margin-bottom: calc(var(--base) * 1.8);
      padding-bottom: calc(var(--base) * 1.2);
    }
    [data-theme="swiss"] .cover-title {
      font-family: var(--font-head);
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: calc(var(--base) * 2.3);
      line-height: 1.2;
      color: var(--ink);
    }
    [data-theme="swiss"] .blk-h2::before {
      content: "";
      display: block;
      width: 28px;
      height: 3px;
      background: var(--accent);
      margin-bottom: 8px;
    }

    /* [02 聖水象牙] */
    [data-theme="seongsu"] .cover {
      border-bottom: 1px solid var(--rule);
      margin-bottom: calc(var(--base) * 1.8);
      padding-bottom: calc(var(--base) * 1.2);
    }
    [data-theme="seongsu"] .cover-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: calc(var(--base) * 2.2);
      color: var(--ink);
    }
    [data-theme="seongsu"] .cover-sub {
      font-family: var(--font-head);
      font-style: italic;
    }
    [data-theme="seongsu"] .blk-h2::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 10px;
      vertical-align: middle;
      position: relative;
      top: -2px;
    }

    /* [03 東京雜誌] */
    [data-theme="tokyo"] .cover {
      border-bottom: 1px solid var(--rule);
      margin-bottom: calc(var(--base) * 1.8);
      padding-bottom: calc(var(--base) * 1.2);
    }
    [data-theme="tokyo"] .cover-title {
      border-left: 6px solid var(--accent);
      padding-left: 18px;
      font-weight: 800;
      font-size: calc(var(--base) * 2.1);
      letter-spacing: 0;
    }
    [data-theme="tokyo"] .blk-h2 {
      border-left: 4px solid var(--accent);
      padding-left: 12px;
    }
    [data-theme="tokyo"] .blk-h3::before {
      content: "■";
      color: var(--accent);
      font-size: 0.65em;
      margin-right: 8px;
      position: relative;
      top: -2px;
    }
    [data-theme="tokyo"] .page-head {
      letter-spacing: 0.22em;
    }

    /* [04 金融簡報] */
    [data-theme="ft"] .cover {
      background: var(--accent);
      padding: 24px 26px;
      border-radius: 4px;
      border-bottom: 0;
      color: #FFFFFF;
      margin-bottom: calc(var(--base) * 1.8);
    }
    [data-theme="ft"] .cover-title,
    [data-theme="ft"] .cover-sub,
    [data-theme="ft"] .cover-meta,
    [data-theme="ft"] .cover-meta span {
      color: #FFFFFF !important;
    }
    [data-theme="ft"] .cover-meta {
      opacity: 0.9;
    }
    [data-theme="ft"] .blk-h2 {
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: calc(var(--base) * 1.25);
      border-bottom: 2px solid var(--accent);
      padding-bottom: 4px;
    }
    [data-theme="ft"] table {
      font-variant-numeric: tabular-nums;
    }
    [data-theme="ft"] tbody tr:nth-child(even) td {
      background: var(--accent-tint);
    }

    /* [05 牛津學術] */
    [data-theme="oxford"] .cover {
      text-align: center;
      border-bottom: 3px double var(--rule);
      padding-bottom: calc(var(--base) * 1.8);
      margin-bottom: calc(var(--base) * 1.8);
    }
    [data-theme="oxford"] .cover-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: calc(var(--base) * 2.2);
    }
    [data-theme="oxford"] .cover-sub {
      font-style: italic;
      text-align: center;
    }
    [data-theme="oxford"] .cover-meta {
      justify-content: center;
    }
    [data-theme="oxford"] .blk-h2 {
      font-variant: small-caps;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 4px;
    }
    [data-theme="oxford"] .blk-h3 {
      font-style: italic;
    }

    /* [00 對話原貌] */
    [data-theme="chat"] .cover {
      border-bottom: 1px solid var(--rule);
      padding-bottom: calc(var(--base) * 1.2);
      margin-bottom: calc(var(--base) * 1.8);
    }
    [data-theme="chat"] .cover-title {
      font-size: calc(var(--base) * 1.8);
      font-weight: 700;
    }
    [data-theme="chat"] .prompt-box {
      max-width: 82%;
      margin-left: auto;
      background: var(--accent-tint);
      border-radius: 18px 18px 4px 18px;
      padding: 12px 18px;
      line-height: 1.6;
      border: 1px solid var(--rule);
    }
    [data-theme="chat"] .prompt-label {
      text-align: right;
      color: var(--muted);
      letter-spacing: 0.06em;
      font-size: 11px;
      margin-bottom: 4px;
    }
    [data-theme="chat"] .answer-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    [data-theme="chat"] .answer-label::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    /* =========================================================
       BLOCKS & CONTENT STYLES
       ========================================================= */
    .blk {
      position: relative;
      margin-bottom: calc(var(--base) * 1.1);
      transition: background 0.15s ease;
    }
    .blk:hover {
      outline: 1px dashed rgba(30, 58, 95, 0.3);
      outline-offset: 4px;
      border-radius: 4px;
    }
    .blk:hover .blk-toolbar {
      opacity: 1;
      pointer-events: auto;
    }

    .blk-toolbar {
      position: absolute;
      top: -12px;
      right: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #FFFFFF;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      padding: 2px 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 20;
    }
    .blk-toolbar button {
      padding: 3px 6px;
      font-size: 11px;
      border-radius: 4px;
      color: #4B5563;
      transition: all 0.1s ease;
    }
    .blk-toolbar button:hover {
      background: #F3F4F6;
      color: #111827;
    }
    .blk-toolbar button.btn-danger:hover {
      background: #FEE2E2;
      color: #DC2626;
    }

    /* Headings */
    .blk-h2 {
      font-family: var(--font-head);
      font-size: calc(var(--base) * 1.45);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
      margin-top: calc(var(--base) * 1.4);
      margin-bottom: calc(var(--base) * 0.7);
    }
    .blk-h3 {
      font-family: var(--font-head);
      font-size: calc(var(--base) * 1.18);
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
      margin-top: calc(var(--base) * 1.1);
      margin-bottom: calc(var(--base) * 0.5);
    }

    /* Paragraphs & Text */
    .blk-p {
      color: var(--ink);
      line-height: 1.75;
      text-align: justify;
    }
    .blk-p strong {
      font-weight: 700;
      color: var(--ink);
    }

    /* Blockquote / Callout */
    .blk-quote {
      border-left: 3px solid var(--accent);
      background: var(--accent-tint);
      padding: 12px 18px;
      border-radius: 0 6px 6px 0;
      font-style: normal;
      color: var(--ink);
      margin: calc(var(--base) * 0.8) 0;
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: calc(var(--base) * 0.8) 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: calc(var(--base) * 0.92);
      line-height: 1.5;
    }
    th {
      background: var(--accent-tint);
      color: var(--ink);
      font-weight: 700;
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid var(--rule);
    }
    td {
      padding: 7px 12px;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
    }

    /* Code & Pre */
    pre {
      border-radius: 8px;
      padding: 14px 18px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: calc(var(--base) * 0.85);
      line-height: 1.55;
      margin: calc(var(--base) * 0.8) 0;
    }
    code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      padding: 2px 5px;
      border-radius: 4px;
    }
    [data-code-theme="dark"] pre {
      background: #1E222A;
      color: #ECEFF4;
      border: 1px solid #2E3440;
    }
    [data-code-theme="dark"] code:not(pre code) {
      background: #2E3440;
      color: #ECEFF4;
    }
    [data-code-theme="light"] pre {
      background: #F8F9FA;
      color: #212529;
      border: 1px solid #E9ECEF;
    }
    [data-code-theme="light"] code:not(pre code) {
      background: var(--accent-tint);
      color: var(--accent);
    }

    /* Lists */
    ul, ol {
      padding-left: 24px;
      margin: calc(var(--base) * 0.5) 0;
    }
    ul { list-style-type: disc; }
    ol { list-style-type: decimal; }
    li {
      margin-bottom: 4px;
      line-height: 1.65;
    }

    /* Table of Contents (TOC) */
    .toc-card {
      background: var(--accent-tint);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 16px 20px;
      margin: calc(var(--base) * 1.2) 0;
    }
    .toc-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: calc(var(--base) * 1.05);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--rule);
      padding-bottom: 6px;
    }
    .toc-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 0;
      font-size: calc(var(--base) * 0.92);
      color: var(--ink);
    }
    .toc-item-dots {
      flex: 1;
      border-bottom: 1px dotted var(--muted);
      margin: 0 8px;
      opacity: 0.4;
    }
    .toc-item-page {
      font-family: var(--font-mono);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================
       PRINT RULES (PDF EXPORT 0 CLUTTER)
       ========================================================= */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        background: #FFFFFF !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      #main-container {
        display: block !important;
        height: auto !important;
        min-height: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
      }
      #canvas-viewport {
        overflow: visible !important;
        padding: 0 !important;
        background: #FFFFFF !important;
      }
      .pages-stack {
        padding: 0 !important;
        gap: 0 !important;
        transform: none !important;
      }
      .page {
        box-shadow: none !important;
        margin: 0 !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      .page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }
      .blk:hover {
        outline: none !important;
      }
      .blk-toolbar {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- =========================================================
       TOPBAR NAVIGATION
       ========================================================= -->
  <header class="no-print h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between shrink-0 z-30 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-[#1E3A5F] text-white flex items-center justify-center font-serif font-bold text-lg shadow-sm">
        F
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-slate-900 text-sm tracking-tight">印務室 Folio Press</h1>
          <span class="text-[10px] bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-mono font-medium">100% 離線免授權版</span>
        </div>
        <p class="text-[11px] text-slate-500 hidden sm:block">AI 對話轉顧問報告 · 出版級 A4 排版 · 3x 長圖輸出</p>
      </div>
    </div>

    <!-- Center Document Quick Controls -->

    // Content Parsing & Block Splitting
    function parseContentToBlocks(mdText) {
      const blocks = [];
      const lines = mdText.split('\n');
      let currentType = null;
      let currentBuffer = [];

      const flushBuffer = () => {
        if (currentBuffer.length === 0) return;
        const text = currentBuffer.join('\n').trim();
        if (!text) {
          currentBuffer = [];
          return;
        }

        let html = marked.parse(text);
        let keepWithNext = false;

        if (currentType === 'h2') {
          keepWithNext = true;
        } else if (currentType === 'h3') {
          keepWithNext = true;
        }

        blocks.push({
          id: 'blk-' + Math.random().toString(36).substr(2, 9),
          type: currentType,
          raw: text,
          html: html,
          keepWithNext: keepWithNext,
          included: true
        });

        currentBuffer = [];
        currentType = null;
      };

      let inCodeBlock = false;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.trim().startsWith('```')) {
          inCodeBlock = !inCodeBlock;
          currentBuffer.push(line);
          if (!inCodeBlock) {
            currentType = 'code';
            flushBuffer();
          }
          continue;
        }

        if (inCodeBlock) {
          currentBuffer.push(line);
          continue;
        }

        if (line.trim().startsWith('## ')) {
          flushBuffer();
          currentType = 'h2';
          currentBuffer.push(line);
          flushBuffer();
          continue;
        }

        if (line.trim().startsWith('### ')) {
          flushBuffer();
          currentType = 'h3';
          currentBuffer.push(line);
          flushBuffer();
          continue;
        }

        if (line.trim().startsWith('# ') && blocks.length === 0) {
          // Document Main Title
          const titleText = line.replace('# ', '').trim();
          state.meta.title = titleText;
          document.getElementById('meta-title').value = titleText;
          continue;
        }

        if (line.trim().startsWith('> ')) {
          if (currentType && currentType !== 'quote') flushBuffer();
          currentType = 'quote';
          currentBuffer.push(line);
          continue;
        }

        if (line.trim().startsWith('|')) {
          if (currentType && currentType !== 'table') flushBuffer();
          currentType = 'table';
          currentBuffer.push(line);
          continue;
        }

        if (line.trim() === '') {
          flushBuffer();
          continue;
        }

        // Regular Paragraph / Lists
        if (!currentType) currentType = 'p';
        currentBuffer.push(line);
      }

      flushBuffer();
      return blocks;
    }

    // AI Denoising Engine (一鍵去除 AI 感)
    function denoiseContent() {
      let content = state.rawContent;

      const aiFluffPatterns = [
        /^(好的[，,！!]?|當然可以[，,！!]?|沒問題[，,！!]?|以下為您整理[：:幾個]?|以下是[針對]*的分析報告[：:]?).*$/gmi,

        /^作為一個[A-Za-z0-9 ]*AI語言模型.*$/gmi,
        /^Certainly! Here is the.*$/gmi,
        /^I hope this helps!.*$/gmi
      ];

      for (let pat of aiFluffPatterns) {
        content = content.replace(pat, '');

      // Clean up multiple empty lines
      content = content.replace(/\n{3,}/g, '\n\n').trim();

    function renderAll() {
      const sandbox = document.getElementById('measure-sandbox');
      const pagesStack = document.getElementById('pages-stack');
      const pageSizeClass = state.paperSize === 'a4' ? 'size-a4' : 'size-letter';
      const availablePageHeight = state.paperSize === 'a4' ? 950 : 880; // Printable inner body height

      // Step 1: Collect Headings for Table of Contents
      const headings = [];
      state.blocks.forEach((blk, idx) => {
        if (!blk.included) return;
        if (blk.type === 'h2') {
          const cleanText = blk.raw.replace(/##\s*/, '').replace(/\*\*/g, '').trim();
          headings.push({ id: blk.id, title: cleanText, level: 2 });
        } else if (blk.type === 'h3') {
          const cleanText = blk.raw.replace(/###\s*/, '').replace(/\*\*/g, '').trim();
          headings.push({ id: blk.id, title: cleanText, level: 3 });
        }
      });

      // Step 2: Measure heights in Sandbox
      sandbox.className = `pages-stack ${state.fontScale}`;
      sandbox.setAttribute('data-theme', state.theme);
      sandbox.innerHTML = '';

      // Measure Cover Block
      const coverHtml = createCoverHtml();
      sandbox.innerHTML = `<div id="measure-cover">${coverHtml}</div>`;
      const coverHeight = document.getElementById('measure-cover').offsetHeight;

      // Measure TOC Block
      let tocHtml = '';
      let tocHeight = 0;
      if (state.showTOC && headings.length > 0) {
        tocHtml = createTOCHtml(headings, {});
        sandbox.innerHTML = `<div id="measure-toc">${tocHtml}</div>`;
        tocHeight = document.getElementById('measure-toc').offsetHeight;
      }

      // Measure Content Blocks
      const measuredBlocks = [];
      state.blocks.forEach(blk => {
        if (!blk.included) return;
        sandbox.innerHTML = `<div class="blk blk-${blk.type}">${blk.html}</div>`;
        const h = sandbox.firstElementChild.offsetHeight + 18; // plus margin
        measuredBlocks.push({
          block: blk,
          height: h
        });
      });

      // Step 3: Run Page Packing Simulation
      const pages = [];
      let currentPage = [];
      let currentHeight = 0;

      // Add Cover to Page 1
      currentPage.push({ type: 'cover', html: coverHtml, height: coverHeight });
      currentHeight += coverHeight;

      // Add TOC to Page 1 if space permits, else push to Page 2
      if (state.showTOC && headings.length > 0) {
        if (currentHeight + tocHeight > availablePageHeight) {
          pages.push(currentPage);
          currentPage = [];
          currentHeight = 0;
        }
        currentPage.push({ type: 'toc', html: tocHtml, height: tocHeight });
        currentHeight += tocHeight;
      }

      // Distribute blocks
      const headingPageMap = {};

      for (let i = 0; i < measuredBlocks.length; i++) {
        const item = measuredBlocks[i];
        const blk = item.block;
        const h = item.height;

        // If block is heading, track its page
        if (blk.type === 'h2' || blk.type === 'h3') {
          headingPageMap[blk.id] = pages.length + 1;
        }

        // Check if fits in current page
        if (currentHeight + h > availablePageHeight && currentPage.length > 0) {
          // Avoid orphan heading at the very bottom
          const lastItem = currentPage[currentPage.length - 1];
          if (lastItem && lastItem.block && lastItem.block.keepWithNext) {
            currentPage.pop();
            pages.push(currentPage);
            currentPage = [lastItem, { type: 'content', block: blk, html: blk.html, height: h }];
            currentHeight = lastItem.height + h;
            continue;
          }

          pages.push(currentPage);
          currentPage = [];
          currentHeight = 0;

          // Re-record heading page if wrapped
          if (blk.type === 'h2' || blk.type === 'h3') {
            headingPageMap[blk.id] = pages.length + 1;
          }
        }

        currentPage.push({ type: 'content', block: blk, html: blk.html, height: h });
        currentHeight += h;
      }

      if (currentPage.length > 0) {
        pages.push(currentPage);
      }

      // Step 4: Re-render TOC with calculated page numbers
      if (state.showTOC && headings.length > 0) {
        const finalizedTocHtml = createTOCHtml(headings, headingPageMap);
        for (let p of pages) {
          for (let item of p) {
            if (item.type === 'toc') {
              item.html = finalizedTocHtml;
            }
          }
        }
      }

      // Step 5: Render Physical A4 Pages to DOM
      const totalPages = pages.length;
      document.getElementById('page-count-badge').innerText = `共 ${totalPages} 頁 · ${state.paperSize.toUpperCase()}`;

      pagesStack.innerHTML = '';

      pages.forEach((pageItems, pageIdx) => {
        const pageNum = pageIdx + 1;
        const pageEl = document.createElement('div');
        pageEl.className = `page ${pageSizeClass}`;
        pageEl.id = `rendered-page-${pageNum}`;

        // Header
        const headerEl = document.createElement('div');
        headerEl.className = 'page-head';
        headerEl.innerHTML = `
          <span>${escapeHtml(state.meta.org)}</span>
          <span class="font-bold text-brand-500">${escapeHtml(state.meta.confidentiality)}</span>
        `;
        pageEl.appendChild(headerEl);

        // Body
        const bodyEl = document.createElement('div');
        bodyEl.className = 'page-body';

        pageItems.forEach(item => {
          if (item.type === 'cover' || item.type === 'toc') {
            const div = document.createElement('div');
            div.innerHTML = item.html;
            bodyEl.appendChild(div.firstElementChild);
          } else {
            const blk = item.block;
            const blkEl = document.createElement('div');
            blkEl.className = `blk blk-${blk.type}`;
            blkEl.id = blk.id;
            blkEl.innerHTML = `
              <div class="blk-toolbar no-print">
                <button onclick="moveBlock('${blk.id}', -1)" title="上移"><i data-lucide="arrow-up" class="w-3 h-3"></i></button>
                <button onclick="moveBlock('${blk.id}', 1)" title="下移"><i data-lucide="arrow-down" class="w-3 h-3"></i></button>

        footerEl.innerHTML = `

        throwOnError: false
      });

    function createTOCHtml(headings, pageMap) {
      const itemsHtml = headings.map(h => {

        const indentClass = h.level === 3 ? 'pl-4 opacity-90' : 'font-semibold';
        return `
          <div class="toc-item ${indentClass}">

            <span class="toc-item-dots"></span>
            <span class="toc-item-page">p. ${pageNum}</span>
          </div>
        `;
      }).join('');

      return `
        <div class="toc-card">
          <div class="toc-title">目錄導引 (Table of Contents)</div>
          <div class="space-y-1">${itemsHtml}</div>
        </div>
      `;
    }

    // Block Manipulations
    function moveBlock(blockId, direction) {
      const idx = state.blocks.findIndex(b => b.id === blockId);
      if (idx < 0) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= state.blocks.length) return;

      const temp = state.blocks[idx];
      state.blocks[idx] = state.blocks[targetIdx];
      state.blocks[targetIdx] = temp;
      renderAll();
      showToast('已調整區塊順序');
    }

    function deleteBlock(blockId) {
      state.blocks = state.blocks.filter(b => b.id !== blockId);
      renderAll();
      showToast('已移除指定區塊');
    }

    async function exportToImage() {
      showToast('正在進行 3 倍超高畫質長圖渲染，請稍候...');
      const stack = document.getElementById('pages-stack');

      // Temporarily remove transform for accurate canvas capture
      const oldTransform = stack.style.transform;
      stack.style.transform = 'none';

      try {
        const canvas = await html2canvas(stack, {
          scale: 3, // 3x Ultra HD
          useCORS: true,
          backgroundColor: '#FFFFFF',
          logging: false
        });

        stack.style.transform = oldTransform;

        const imgData = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = imgData;
        const sanitizedTitle = state.meta.title.replace(/[^\w\u4e00-\u9fa5]/g, '_');
        a.download = `${sanitizedTitle}_3x_LongImage.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('3x 高畫質長圖下載完成！');
      } catch (err) {
        stack.style.transform = oldTransform;
        console.error('Long image export failed', err);
        alert('長圖渲染失敗：' + err.message);
      }
    }

    // 3. Export to Markdown (.md)
    function exportToMarkdown() {
      let md = `# ${state.meta.title}\n\n`;
      if (state.meta.subtitle) md += `> **副標題**：${state.meta.subtitle}\n\n`;
      md += `* 機構：${state.meta.org}\n`;
      md += `* 作者：${state.meta.author}\n`;
      md += `* 日期：${state.meta.date}\n`;
      md += `* 密級：${state.meta.confidentiality}\n\n---\n\n`;

      state.blocks.forEach(b => {
        if (!b.included) return;
        md += b.raw + '\n\n';
      });

      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const sanitizedTitle = state.meta.title.replace(/[^\w\u4e00-\u9fa5]/g, '_');
      a.download = `${sanitizedTitle}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('已匯出 Markdown 檔案！');
    }

    // 4. Copy Rich Text for Microsoft Word / Notion
    async function copyRichText() {
      let html = `<div style="font-family: sans-serif; line-height: 1.6;">`;
      html += `<h1>${escapeHtml(state.meta.title)}</h1>`;
      if (state.meta.subtitle) html += `<p><em>${escapeHtml(state.meta.subtitle)}</em></p>`;
      html += `<p><small>${escapeHtml(state.meta.org)} · ${escapeHtml(state.meta.date)} · ${escapeHtml(state.meta.confidentiality)}</small></p><hr/>`;

      state.blocks.forEach(b => {
        if (!b.included) return;
        html += b.html;
      });
      html += `</div>`;

      try {
        const blob = new Blob([html], { type: 'text/html' });
        const textBlob = new Blob([state.rawContent], { type: 'text/plain' });
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/html': blob,
            'text/plain': textBlob
          })
        ]);
        showToast('已複製富文本！可直接貼上至 Word 或 Notion');
      } catch (e) {
        console.error('Clipboard copy failed', e);
        showToast('剪貼簿複製受限，請直接匯出 Markdown 或 PDF');
      }
    }

    // Utility: Show Toast Notification
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3200);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
