<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣高速公路過路費估算器</title>
    <meta name="description" content="設定起點、途經點與終點，自動偵測高速公路交流道並估算 eTag 過路費">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg-1:#0f1117;--bg-2:#1a1d27;--bg-g:rgba(30,34,48,.72);
            --brd:rgba(255,255,255,.08);--brd-a:rgba(66,133,244,.45);
            --t1:#e8eaed;--t2:#9aa0a6;--t3:#5f6368;
            --acc:#4285f4;--acc-l:#8ab4f8;
            --grad:linear-gradient(135deg,#667eea,#764ba2);
            --grn:#34a853;--yel:#fbbc04;--red:#ea4335;--org:#fa7b17;--toll:#f9ab00;
            --hw1:#4285f4;--hw3:#34a853;--hw5:#a142f4;--hwo:#fa7b17;
            --r:8px;--rm:12px;--rl:16px;
            --font:'Inter','Noto Sans TC',-apple-system,sans-serif;
            --sb:430px;--tr:all .3s cubic-bezier(.4,0,.2,1);
        }
        body{font-family:var(--font);background:var(--bg-1);color:var(--t1);height:100vh;overflow:hidden;display:flex}

        /* Sidebar */
        .sb{width:var(--sb);height:100vh;background:var(--bg-2);border-right:1px solid var(--brd);display:flex;flex-direction:column;z-index:10;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
        .sb::-webkit-scrollbar{width:5px}.sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
        .sb-hd{padding:22px 22px 16px;border-bottom:1px solid var(--brd);background:linear-gradient(180deg,rgba(102,126,234,.06),transparent)}
        .sb-hd h1{font-size:19px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.3px;margin-bottom:3px}
        .sb-hd p{font-size:11px;color:var(--t3);letter-spacing:.3px}

        /* API */
        .api{padding:14px 22px;border-bottom:1px solid var(--brd);background:rgba(66,133,244,.04)}
        .api label{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:7px}
        .api-r{display:flex;gap:8px}
        .api-r input{flex:1;padding:9px 12px;border:1px solid var(--brd);border-radius:var(--r);background:var(--bg-1);color:var(--t1);font-size:12px;font-family:'Courier New',monospace;transition:var(--tr)}
        .api-r input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(66,133,244,.12)}
        .bsm{padding:9px 16px;border:none;border-radius:var(--r);background:var(--acc);color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr);white-space:nowrap}
        .bsm:hover{background:#5a95f5;transform:translateY(-1px)}.bsm:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
        .api-st{margin-top:5px;font-size:11px;min-height:16px}
        .api-st.ok{color:var(--grn)}.api-st.err{color:var(--red)}.api-st.ld{color:var(--t2)}
        .api-h{margin-top:6px;font-size:10px;color:var(--t3);line-height:1.6}.api-h a{color:var(--acc-l);text-decoration:none}

        /* Route */
        .rt{padding:18px 22px;border-bottom:1px solid var(--brd)}
        .st{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
        .ig{margin-bottom:8px}
        .ig>label{font-size:11px;font-weight:500;color:var(--t3);display:block;margin-bottom:5px}
        .ir{display:flex;gap:5px;align-items:stretch}
        .iw{position:relative;flex:1}
        .iw .dot{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;z-index:2}
        .d-s{background:var(--grn);box-shadow:0 0 6px rgba(52,168,83,.4)}
        .d-e{background:var(--red);box-shadow:0 0 6px rgba(234,67,53,.4)}
        .d-w{background:var(--org);box-shadow:0 0 6px rgba(250,123,23,.4)}
        .iw input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--brd);border-radius:var(--r);background:var(--bg-1);color:var(--t1);font-size:13px;font-family:var(--font);transition:var(--tr)}
        .iw input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(66,133,244,.12)}
        .iw input::placeholder{color:var(--t3)}.iw input:disabled{opacity:.35;cursor:not-allowed}

        .bp{width:38px;border:1px solid var(--brd);border-radius:var(--r);background:transparent;color:var(--t2);font-size:15px;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .bp:hover{border-color:var(--acc);color:var(--acc);background:rgba(66,133,244,.06)}
        .bp.on{border-color:var(--acc);color:#fff;background:var(--acc);animation:ppulse 1.5s ease infinite}
        .bp:disabled{opacity:.35;cursor:not-allowed}
        @keyframes ppulse{0%,100%{box-shadow:0 0 0 0 rgba(66,133,244,.3)}50%{box-shadow:0 0 0 6px rgba(66,133,244,0)}}

        .bd{width:32px;border:none;border-radius:var(--r);background:transparent;color:var(--t3);font-size:14px;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .bd:hover{color:var(--red);background:rgba(234,67,53,.1)}

        .conn{width:2px;height:6px;background:var(--brd);margin-left:16px}
        .chint{font-size:11px;color:var(--acc-l);margin-top:6px;min-height:16px;transition:var(--tr)}

        /* Add waypoint btn */
        .btn-add{width:100%;padding:8px;border:1px dashed rgba(255,255,255,.12);border-radius:var(--r);background:transparent;color:var(--t2);font-size:12px;font-family:var(--font);cursor:pointer;transition:var(--tr);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
        .btn-add:hover{border-color:var(--acc);color:var(--acc);background:rgba(66,133,244,.04)}
        .btn-add:disabled{opacity:.35;cursor:not-allowed}
        .btn-add .plus{font-size:16px;font-weight:300;line-height:1}

        /* Vehicle */
        .vg{margin-top:12px}
        .vs{display:flex;gap:6px}
        .vb{flex:1;padding:7px 4px;border:1px solid var(--brd);border-radius:var(--r);background:transparent;color:var(--t2);font-size:12px;font-family:var(--font);cursor:pointer;text-align:center;transition:var(--tr)}
        .vb.on{border-color:var(--acc);background:rgba(66,133,244,.12);color:var(--t1);font-weight:600}
        .vb:hover:not(.on){border-color:rgba(66,133,244,.25)}
        .vb .rt2{display:block;font-size:10px;color:var(--t3);margin-top:1px;font-weight:400}
        .vb.on .rt2{color:var(--acc-l)}

        .bsearch{width:100%;padding:12px;border:none;border-radius:var(--r);background:var(--grad);color:#fff;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:var(--tr);margin-top:14px}
        .bsearch:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(102,126,234,.35)}
        .bsearch:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}

        /* Routes */
        .rs-sec{padding:16px 22px;border-bottom:1px solid var(--brd)}
        .rc{padding:13px;border:1px solid var(--brd);border-radius:var(--rm);margin-bottom:8px;cursor:pointer;transition:var(--tr);border-left:3px solid transparent}
        .rc:hover{border-color:rgba(66,133,244,.25);background:rgba(66,133,244,.04)}
        .rc.sel{border-color:var(--brd-a);border-left-color:var(--acc);background:rgba(66,133,244,.08)}
        .rc .rn{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:8px}
        .rbdg{font-size:9px;padding:2px 7px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700}
        .rc .rs2{font-size:11px;color:var(--t3);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .rc .rm2{display:flex;gap:14px;font-size:12px;color:var(--t2)}

        /* Toll */
        .tl-sec{padding:16px 22px 24px}
        .tc{background:var(--bg-g);border:1px solid var(--brd);border-radius:var(--rl);padding:20px;backdrop-filter:blur(16px)}
        .ta{font-size:36px;font-weight:700;color:var(--toll);line-height:1;letter-spacing:-1px}
        .tl-lb{font-size:12px;color:var(--t2);margin:4px 0 16px}
        .tl-sts{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
        .tl-st{padding:7px 11px;background:rgba(255,255,255,.03);border-radius:var(--r);border:1px solid var(--brd);font-size:11px;color:var(--t2)}
        .tl-st strong{color:var(--t1);font-weight:600}

        .ic-tt{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
        .ic-tl{position:relative;padding-left:20px}
        .ic-tl::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--brd);border-radius:1px}
        .ic-n{position:relative;padding:5px 0 5px 16px;font-size:12px;color:var(--t2);transition:var(--tr)}
        .ic-n::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--t3);border:2px solid var(--bg-2);z-index:1;transition:var(--tr)}
        .ic-n.en::before{background:var(--grn);width:10px;height:10px;left:-15px;box-shadow:0 0 6px rgba(52,168,83,.5)}
        .ic-n.ex::before{background:var(--red);width:10px;height:10px;left:-15px;box-shadow:0 0 6px rgba(234,67,53,.5)}
        .ic-n.en,.ic-n.ex{color:var(--t1);font-weight:600;font-size:13px}
        .ic-n .km{font-size:10px;color:var(--t3);font-weight:400;margin-left:6px}
        .ic-n:hover{color:var(--t1)}

        .sh{display:flex;align-items:center;gap:10px;margin:14px 0 8px;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:var(--r);border-left:3px solid var(--hw1)}
        .sh[data-h="3"]{border-left-color:var(--hw3)}.sh[data-h="5"]{border-left-color:var(--hw5)}
        .sh .ht{font-size:11px;font-weight:700;padding:3px 9px;border-radius:4px;color:#fff;background:var(--hw1)}
        .sh .ht[data-h="3"]{background:var(--hw3)}.sh .ht[data-h="5"]{background:var(--hw5)}.sh .ht[data-h="o"]{background:var(--hwo)}
        .sh .sm{font-size:11px;color:var(--t2)}

        .tn{margin-top:16px;padding:12px;background:rgba(251,188,4,.06);border-radius:var(--r);border:1px solid rgba(251,188,4,.15)}
        .tn p{font-size:11px;color:var(--yel);line-height:1.7}.tn p+p{margin-top:3px}

        .nohw{text-align:center;padding:28px 16px;color:var(--t2)}
        .nohw .ni{font-size:36px;margin-bottom:8px;opacity:.6}
        .nohw .nt2{font-size:14px;font-weight:600;margin-bottom:3px}
        .nohw .nd{font-size:12px;color:var(--t3)}

        /* Map */
        .mb{flex:1;height:100vh;position:relative}
        #map{width:100%;height:100%}
        .mph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-1);z-index:5}
        .mph .ic2{width:80px;height:80px;border-radius:50%;background:var(--bg-2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
        .mph .ic2 svg{width:36px;height:36px;fill:var(--t3)}
        .mph h2{font-size:18px;font-weight:600;margin-bottom:5px}
        .mph p{font-size:13px;color:var(--t3)}

        .mm{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;padding:10px 20px;border-radius:var(--rm);font-size:13px;font-weight:600;font-family:var(--font);color:#fff;pointer-events:none;transition:var(--tr);opacity:0}
        .mm.show{opacity:1}
        .mm.ms{background:rgba(52,168,83,.9);box-shadow:0 4px 16px rgba(52,168,83,.3)}
        .mm.me{background:rgba(234,67,53,.9);box-shadow:0 4px 16px rgba(234,67,53,.3)}
        .mm.mw{background:rgba(250,123,23,.9);box-shadow:0 4px 16px rgba(250,123,23,.3)}

        @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.an{animation:fi .3s ease-out forwards}

        .pac-container{background:var(--bg-2)!important;border:1px solid var(--brd)!important;border-radius:var(--r)!important;box-shadow:0 4px 16px rgba(0,0,0,.4)!important;font-family:var(--font)!important;margin-top:4px!important;z-index:9999!important}
        .pac-item{padding:10px 14px!important;border-top:1px solid var(--brd)!important;color:var(--t1)!important;font-size:13px!important;cursor:pointer!important;line-height:1.5!important}
        .pac-item:first-child{border-top:none!important}
        .pac-item:hover{background:rgba(66,133,244,.08)!important}
        .pac-item-query{color:var(--t1)!important;font-weight:600!important}
        .pac-icon{display:none!important}
        .pac-matched{color:var(--acc-l)!important}

        @media(max-width:860px){:root{--sb:100%}body{flex-direction:column}.sb{height:auto;max-height:55vh}.mb{height:45vh}}
    </style>
</head>
<body>
    <aside class="sb">
        <div class="sb-hd"><h1>高速公路過路費估算</h1><p>Taiwan Highway Toll Estimator</p></div>

        <div class="api">
            <label>Google Maps API Key</label>
            <div class="api-r">
                <input type="password" id="keyIn" placeholder="貼上 API Key...">
                <button class="bsm" id="bLoad">載入</button>
            </div>
            <div class="api-st" id="apiSt"></div>
            <div class="api-h">需啟用 Maps JavaScript、Places、Directions API。<a href="https://console.cloud.google.com/apis/credentials" target="_blank">取得 Key</a></div>
        </div>

        <div class="rt" id="routePanel">
            <div class="st">路線規劃</div>

            <!-- Start -->
            <div class="ig">
                <label>起點</label>
                <div class="ir">
                    <div class="iw"><div class="dot d-s"></div><input type="text" id="inS" placeholder="輸入地址或地圖點選" disabled></div>
                    <button class="bp" id="pS" disabled>&#128205;</button>
                </div>
            </div>
            <div class="conn"></div>

            <!-- Waypoints container -->
            <div id="wpBox"></div>

            <!-- End -->
            <div class="ig">
                <label>終點</label>
                <div class="ir">
                    <div class="iw"><div class="dot d-e"></div><input type="text" id="inE" placeholder="輸入地址或地圖點選" disabled></div>
                    <button class="bp" id="pE" disabled>&#128205;</button>
                </div>
            </div>

            <div class="chint" id="cHint"></div>

            <button class="btn-add" id="bAdd" disabled><span class="plus">+</span> 新增途經點</button>

            <div class="vg">
                <label style="font-size:11px;font-weight:500;color:var(--t3);display:block;margin-bottom:5px">車輛類型</label>
                <div class="vs">
                    <button class="vb on" data-rate="1.20">小型車<span class="rt2">$1.20/km</span></button>
                    <button class="vb" data-rate="1.50">大型車<span class="rt2">$1.50/km</span></button>
                    <button class="vb" data-rate="1.80">聯結車<span class="rt2">$1.80/km</span></button>
                </div>
            </div>
            <button class="bsearch" id="bSrch" disabled>搜尋路線</button>
        </div>

        <div class="rs-sec" id="rsSec" style="display:none"><div class="st">路線方案</div><div id="rsList"></div></div>
        <div class="tl-sec" id="tlSec" style="display:none"><div class="st">過路費估算</div><div id="tlRes"></div></div>
    </aside>

    <div class="mb">
        <div id="map"></div>
        <div class="mm" id="mapMode"></div>
        <div class="mph" id="mapPH">
            <div class="ic2"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
            <h2>請先載入 Google Maps</h2><p>在左側欄輸入 API Key 後點擊「載入」</p>
        </div>
    </div>

<script>
/* ================================================================ State */
let map,dirSvc,geo;
let renderers=[];
let acS,acE;
let routes=[],selIdx=-1,tollRate=1.20,loaded=false;
let clickMode=null; // null|'start'|'end'|'wp-N'
let mkS=null,mkE=null,llS=null,llE=null;

// Waypoints: [{latLng,marker,ac}]
let wps=[];

const $=id=>document.getElementById(id);
const $key=$('keyIn'),$bLoad=$('bLoad'),$ast=$('apiSt');
const $inS=$('inS'),$inE=$('inE');
const $pS=$('pS'),$pE=$('pE'),$hint=$('cHint');
const $bSrch=$('bSrch'),$bAdd=$('bAdd');
const $rsSec=$('rsSec'),$rsList=$('rsList');
const $tlSec=$('tlSec'),$tlRes=$('tlRes');
const $ph=$('mapPH'),$mm=$('mapMode');
const $wpBox=$('wpBox');

/* ================================================================ Events */
$bLoad.onclick=loadAPI;
$key.onkeydown=e=>{if(e.key==='Enter')loadAPI()};
$bSrch.onclick=searchRoute;
$pS.onclick=()=>setMode('start');
$pE.onclick=()=>setMode('end');
$bAdd.onclick=addWaypoint;

document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.vb').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); tollRate=parseFloat(b.dataset.rate);
    if(selIdx>=0) analyze(selIdx);
});

/* ================================================================ Click Mode */
function setMode(m){
    if(clickMode===m){clearMode();return;}
    clickMode=m;
    // Update pin highlights
    $pS.classList.toggle('on',m==='start');
    $pE.classList.toggle('on',m==='end');
    document.querySelectorAll('.bp-wp').forEach((b,i)=>b.classList.toggle('on',m==='wp-'+i));

    const labels={start:'點選地圖設定起點',end:'點選地圖設定終點'};
    if(m.startsWith('wp-')) labels[m]='點選地圖設定途經點 '+(parseInt(m.split('-')[1])+1);
    $hint.textContent=labels[m]||'';
    const cls=m==='start'?'ms':m==='end'?'me':'mw';
    $mm.textContent=labels[m]||'';
    $mm.className='mm show '+cls;
    if(map)map.setOptions({draggableCursor:'crosshair'});
}

function clearMode(){
    clickMode=null;
    $pS.classList.remove('on');$pE.classList.remove('on');
    document.querySelectorAll('.bp-wp').forEach(b=>b.classList.remove('on'));
    $hint.textContent='';
    $mm.classList.remove('show');
    if(map)map.setOptions({draggableCursor:null});
}

function onMapClick(e){
    if(!clickMode)return;
    const ll=e.latLng;
    if(clickMode==='start'){
        llS=ll; placeMk('start',ll); revGeo(ll,$inS);
        if(!llE && !$inE.value) setMode('end'); else clearMode();
    } else if(clickMode==='end'){
        llE=ll; placeMk('end',ll); revGeo(ll,$inE); clearMode();
    } else if(clickMode.startsWith('wp-')){
        const i=parseInt(clickMode.split('-')[1]);
        if(i<wps.length){
            wps[i].latLng=ll;
            placeWpMk(i,ll);
            const inp=$wpBox.querySelectorAll('.wp-in')[i];
            if(inp) revGeo(ll,inp);
        }
        clearMode();
    }
}

/* ================================================================ Markers */
function placeMk(type,ll){
    const isS=type==='start';
    const old=isS?mkS:mkE;
    if(old)old.setMap(null);
    const mk=new google.maps.Marker({
        position:ll,map,draggable:true,zIndex:100,
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:isS?'#34a853':'#ea4335',fillOpacity:1,strokeColor:'#fff',strokeWeight:2.5},
        title:isS?'起點':'終點',
    });
    mk.addListener('dragend',()=>{
        const p=mk.getPosition();
        if(isS){llS=p;revGeo(p,$inS);}else{llE=p;revGeo(p,$inE);}
    });
    if(isS)mkS=mk;else mkE=mk;
}

function placeWpMk(idx,ll){
    if(wps[idx].marker) wps[idx].marker.setMap(null);
    const mk=new google.maps.Marker({
        position:ll,map,draggable:true,zIndex:90,
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#fa7b17',fillOpacity:1,strokeColor:'#fff',strokeWeight:2.5},
        title:'途經點 '+(idx+1),
    });
    mk.addListener('dragend',()=>{
        const p=mk.getPosition();
        wps[idx].latLng=p;
        const inp=$wpBox.querySelectorAll('.wp-in')[idx];
        if(inp) revGeo(p,inp);
    });
    wps[idx].marker=mk;
}

function revGeo(ll,el){
    geo.geocode({location:ll},(r,s)=>{
        el.value=(s==='OK'&&r[0])?r[0].formatted_address:ll.lat().toFixed(6)+', '+ll.lng().toFixed(6);
    });
}

/* ================================================================ Waypoints */
function addWaypoint(){
    const idx=wps.length;
    wps.push({latLng:null,marker:null,ac:null});

    const row=document.createElement('div');
    row.className='ig wp-row';
    row.dataset.idx=idx;
    row.innerHTML=`
        <label>途經點 ${idx+1}</label>
        <div class="ir">
            <div class="iw"><div class="dot d-w"></div>
                <input type="text" class="wp-in" placeholder="途經點 ${idx+1}" data-idx="${idx}">
            </div>
            <button class="bp bp-wp" data-idx="${idx}" title="地圖選取">&#128205;</button>
            <button class="bd" data-idx="${idx}" title="移除">&times;</button>
        </div>
        <div class="conn"></div>
    `;

    $wpBox.appendChild(row);

    // Events
    const pinBtn=row.querySelector('.bp-wp');
    const delBtn=row.querySelector('.bd');
    const inp=row.querySelector('.wp-in');

    pinBtn.onclick=()=>setMode('wp-'+row.dataset.idx);
    delBtn.onclick=()=>removeWaypoint(parseInt(row.dataset.idx));

    // Autocomplete
    const bounds=new google.maps.LatLngBounds({lat:21.85,lng:119.9},{lat:25.35,lng:122.05});
    wps[idx].ac=new google.maps.places.Autocomplete(inp,{bounds,componentRestrictions:{country:'tw'},fields:['place_id','geometry','name','formatted_address']});

    // Auto enter pin mode
    setMode('wp-'+idx);
}

function removeWaypoint(idx){
    if(idx>=wps.length)return;
    if(wps[idx].marker) wps[idx].marker.setMap(null);
    wps.splice(idx,1);
    rebuildWpUI();
    clearMode();
}

function rebuildWpUI(){
    $wpBox.innerHTML='';
    const saved=wps.map(w=>({latLng:w.latLng,address:null}));
    // Read addresses from existing inputs would be lost; use latLng to re-populate
    wps.forEach((w,i)=>{w.ac=null;});

    wps.forEach((w,i)=>{
        const row=document.createElement('div');
        row.className='ig wp-row';
        row.dataset.idx=i;
        row.innerHTML=`
            <label>途經點 ${i+1}</label>
            <div class="ir">
                <div class="iw"><div class="dot d-w"></div>
                    <input type="text" class="wp-in" placeholder="途經點 ${i+1}" data-idx="${i}">
                </div>
                <button class="bp bp-wp" data-idx="${i}" title="地圖選取">&#128205;</button>
                <button class="bd" data-idx="${i}" title="移除">&times;</button>
            </div>
            <div class="conn"></div>
        `;
        $wpBox.appendChild(row);

        const pinBtn=row.querySelector('.bp-wp');
        const delBtn=row.querySelector('.bd');
        const inp=row.querySelector('.wp-in');

        pinBtn.onclick=()=>setMode('wp-'+i);
        delBtn.onclick=()=>removeWaypoint(i);

        const bounds=new google.maps.LatLngBounds({lat:21.85,lng:119.9},{lat:25.35,lng:122.05});
        w.ac=new google.maps.places.Autocomplete(inp,{bounds,componentRestrictions:{country:'tw'},fields:['place_id','geometry','name','formatted_address']});

        // Restore address via reverse geocode if latLng exists
        if(w.latLng) revGeo(w.latLng,inp);
    });
}

/* ================================================================ Search */
function searchRoute(){
    if(!$inS.value.trim()||!$inE.value.trim())return;
    clearRoutes();
    $bSrch.textContent='搜尋中...';$bSrch.disabled=true;

    // Build waypoints
    const wpLocs=[];
    wps.forEach((w,i)=>{
        const inp=$wpBox.querySelectorAll('.wp-in')[i];
        const loc=w.latLng||((inp&&inp.value.trim())?inp.value.trim():null);
        if(loc) wpLocs.push({location:loc,stopover:true});
    });

    dirSvc.route({
        origin:llS||$inS.value,
        destination:llE||$inE.value,
        waypoints:wpLocs,
        travelMode:google.maps.TravelMode.DRIVING,
        provideRouteAlternatives:wpLocs.length===0, // no alternatives when waypoints
        region:'TW',
    },(r,s)=>{
        $bSrch.textContent='搜尋路線';$bSrch.disabled=false;
        if(s==='OK'){routes=r.routes;showRoutes(r);}
        else alert('無法取得路線：'+s);
    });
}

function clearRoutes(){
    renderers.forEach(r=>r.setMap(null));
    renderers=[];routes=[];selIdx=-1;
    $rsSec.style.display='none';$tlSec.style.display='none';

    analyze(i);
}

/* ================================================================ Analyze */
function analyze(idx){
    const route=routes[idx];
    // Flatten steps across all legs
    const allSteps=route.legs.flatMap(l=>l.steps);
    const segments=[];
    let onHw=false,hwN='',hwNum='',dist=0,enN='',enL=null,exL=null;

    for(let i=0;i<allSteps.length;i++){
        const txt=strip(allSteps[i].instructions||'');
        const m=txt.match(/國道(\d+)號/);
        if(m){
            const num=m[1],name='國道'+num+'號';
            if(!onHw){onHw=true;hwN=name;hwNum=num;dist=allSteps[i].distance.value;enN=findIC(txt,allSteps,i,'en');enL=allSteps[i].start_location;}
            else if(name!==hwN){exL=allSteps[i].start_location;segments.push({highway:hwN,hwNum,entry:enN,exit:'系統交流道',distance:dist,enL,exL});hwN=name;hwNum=num;dist=allSteps[i].distance.value;enN='系統交流道';enL=allSteps[i].start_location;}
            else{dist+=allSteps[i].distance.value;}
        } else if(onHw){
            exL=allSteps[i].start_location;
            segments.push({highway:hwN,hwNum,entry:enN,exit:findIC(txt,allSteps,i,'ex'),distance:dist,enL,exL});
            onHw=false;hwN='';dist=0;
        }
    }
    if(onHw){
        const last=allSteps[allSteps.length-1];
        exL=last.end_location;
        segments.push({highway:hwN,hwNum,entry:enN,exit:'(終點附近)',distance:dist,enL,exL});
    }

    segments.forEach(seg=>{seg.icList=matchICs(seg.hwNum,seg.enL,seg.exL);});
    showToll(segments,route);
}

function findIC(txt,steps,idx,dir){
    const ps=[/從(.+?)交流道/,/(.+?)交流道/,/(.+?)系統/,/(.+?)出口/,/(.+?)端/,/走(.+?)的匝道/];
    const ts=[txt];
    if(dir==='en'&&idx>0)ts.unshift(strip(steps[idx-1].instructions||''));
    if(dir==='ex'&&idx+1<steps.length)ts.push(strip(steps[idx+1].instructions||''));
    for(const t of ts)for(const p of ps){const m=t.match(p);if(m){let n=m[1].trim().replace(/^(走|從|沿|靠左走|靠右走|合併到)\s*/g,'');if(n.length>0&&n.length<15)return n;}}
    return dir==='en'?'(上匝道)':'(下匝道)';
}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent||'';}

/* ================================================================ IC Match */
function matchICs(hwNum,enL,exL){
    const db=IC_DB[hwNum];if(!db||!db.length)return[];
    const eIC=nearest(db,enL),xIC=nearest(db,exL);
    if(!eIC||!xIC)return[];
    if(eIC.i===xIC.i)return[{...db[eIC.i],role:'both'}];
    const asc=eIC.i<xIC.i, lo=Math.min(eIC.i,xIC.i), hi=Math.max(eIC.i,xIC.i);
    const res=[];
    for(let i=lo;i<=hi;i++){
        const ic=db[asc?i:(hi-(i-lo))];
        const role=(asc?(i===lo?'en':i===hi?'ex':'via'):(i===hi?'en':i===lo?'ex':'via'));
        res.push({...ic,role});
    }
    return res;
}
function nearest(db,loc){
    if(!loc)return null;
    let best=null,bd=Infinity;
    const lat=typeof loc.lat==='function'?loc.lat():loc.lat;
    const lng=typeof loc.lng==='function'?loc.lng():loc.lng;
    db.forEach((ic,i)=>{const d=hav(lat,lng,ic.lat,ic.lng);if(d<bd){bd=d;best={i,d};}});
    return best&&best.d<15?best:null;
}
function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),s=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}

/* ================================================================ Show Toll */
function showToll(segs,route){
    $tlSec.style.display='block';
    if(!segs.length){
        $tlRes.innerHTML='<div class="nohw an"><div class="ni">&#128739;</div><div class="nt2">此路線未使用國道高速公路</div><div class="nd">無需支付高速公路過路費</div></div>';
        $tlSec.scrollIntoView({behavior:'smooth',block:'nearest'});return;
    }
    const hwM=segs.reduce((s,x)=>s+x.distance,0), hwKm=hwM/1000;
    const totalD=route.legs.reduce((s,l)=>s+l.distance.value,0);
    const totalT=route.legs.reduce((s,l)=>s+l.duration.value,0);
    const vL=document.querySelector('.vb.on').childNodes[0].textContent.trim();

    let toll=Math.round(hwKm*tollRate),dH='';
    if(hwKm>200){const b=toll;toll=Math.round(b-(hwKm-200)*tollRate*.2);dH=`<p>已套用長途優惠（200 km 以上 8 折），原價 NT$ ${b.toLocaleString()}</p>`;}

    let sH='';
    segs.forEach((seg,si)=>{
        const hk=['1','3','5'].includes(seg.hwNum)?seg.hwNum:'other';
        const sk=(seg.distance/1000).toFixed(1), st=Math.round((seg.distance/1000)*tollRate);
        sH+=`<div class="sh an" data-h="${hk}" style="animation-delay:${si*.06}s"><span class="ht" data-h="${hk}">${seg.highway}</span><span class="sm">${seg.entry} → ${seg.exit}｜${sk} km｜NT$ ${st.toLocaleString()}</span></div>`;
        if(seg.icList&&seg.icList.length){
            sH+='<div class="ic-tl an" style="animation-delay:'+((si*.06)+.04)+'s">';
            seg.icList.forEach(ic=>{
                const cls=ic.role==='en'?'en':ic.role==='ex'?'ex':ic.role==='both'?'en ex':'';
                const lb=ic.role==='en'?' (上)':ic.role==='ex'?' (下)':ic.role==='both'?' (上/下)':'';
                sH+=`<div class="ic-n ${cls}">${ic.name}${lb}<span class="km">${ic.km.toFixed(1)}K</span></div>`;
            });
            sH+='</div>';
        }
    });

    $tlRes.innerHTML=`
        <div class="tc an">
            <div class="ta">NT$ ${toll.toLocaleString()}</div>
            <div class="tl-lb">預估過路費（${vL}，${tollRate} 元/km）</div>
            <div class="tl-sts">
                <div class="tl-st">全程 <strong>${fmtDist(totalD)}</strong></div>
                <div class="tl-st">時間 <strong>${fmtDur(totalT)}</strong></div>
                <div class="tl-st">國道 <strong>${hwKm.toFixed(1)} km</strong></div>
                ${route.legs.length>1?'<div class="tl-st">途經 <strong>'+(route.legs.length-1)+' 點</strong></div>':''}
            </div>
            <div class="ic-tt">沿途交流道清單</div>
            ${sH}
            <div class="tn">
                <p>費率：小型車 $1.20/km、大型車 $1.50/km、聯結車 $1.80/km</p>
                ${dH}
                <p>此為依里程概估值，實際費用以 eTag 門架計費為準。</p>
            </div>
        </div>`;
    $tlSec.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function fmtDist(m){return m>=1000?(m/1000).toFixed(1)+' 公里':m+' 公尺';}
function fmtDur(s){const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h>0?h+' 小時 '+m+' 分':m+' 分鐘';}
